<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff" id="meta-theme">
<title>팀 스케줄러</title>
<style>
:root[data-theme="light"]{
  --bg:#eff1f5; --surface:#ffffff; --surface-2:#f4f6fa; --surface-3:#e2e6ee;
  --text:#14171f; --text-2:#6b7280; --text-3:#a5abb6;
  --line:#e2e6ee; --line-2:#f1f3f7;
  --accent:#2f6df6; --accent-soft:#e6eefe; --accent-text:#ffffff;
  --danger:#e5484d; --danger-soft:#fdeaea;
  --ok:13,148,136; --no:234,115,23;
  --decided:109,40,217; --decided-soft:#f1ebfd;
  --ok-a:.34; --no-a:.32;
  --heat:13,148,136; --heat-max:.80; --bg-heat-scale:.34;
  --hatch:90,99,114; --hatch-a:.55;
  --grid-line:#eef0f5; --grid-half:#f6f7fa; --grid-hour:#dfe3ec;
  --tl-dawn:#f2f4f9; --tl-day:#fdfaf3; --tl-evening:#f7f3f9; --tl-night:#edeff6;
  --sat:#2f6df6; --sun:#e5484d;
  --shadow:0 1px 3px rgba(20,23,31,.07);
  --shadow-pop:0 8px 24px rgba(20,23,31,.14);
  --neutral-banner:#8b94a6;
}
:root[data-theme="dark"]{
  --bg:#0d1017; --surface:#161a23; --surface-2:#1f2430; --surface-3:#2a3040;
  --text:#eef1f6; --text-2:#8f97a6; --text-3:#5e6676;
  --line:#242a36; --line-2:#1c212b;
  --accent:#4d86ff; --accent-soft:#16233a; --accent-text:#ffffff;
  --danger:#ff6b6b; --danger-soft:#3a1d22;
  --ok:45,212,191; --no:251,146,60;
  --decided:167,139,250; --decided-soft:#241b3d;
  --ok-a:.34; --no-a:.32;
  --heat:45,212,191; --heat-max:.74; --bg-heat-scale:.38;
  --hatch:150,160,178; --hatch-a:.50;
  --grid-line:#1d222d; --grid-half:#191e28; --grid-hour:#2a3141;
  --tl-dawn:#121721; --tl-day:#1b1a15; --tl-evening:#1a1622; --tl-night:#101420;
  --sat:#7aa5ff; --sun:#ff8585;
  --shadow:0 1px 3px rgba(0,0,0,.3);
  --shadow-pop:0 8px 24px rgba(0,0,0,.5);
  --neutral-banner:#4a5364;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{color-scheme:light dark}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;min-height:100vh;display:flex;justify-content:center;transition:background .2s,color .2s}
button,input{font:inherit;color:inherit}
button{border:0;cursor:pointer;background:none}
button:disabled{cursor:not-allowed;opacity:.35}

.shell{width:100%;max-width:390px;min-height:100vh;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;position:relative}

.card{background:var(--surface);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.sec-label{font-size:11px;font-weight:600;color:var(--text-2);letter-spacing:.03em;margin:0 4px 8px;text-transform:uppercase}
.input{width:100%;background:var(--surface-2);border:1.5px solid transparent;border-radius:12px;padding:12px 13px;font-size:16px;outline:none;transition:all .15s}
.input:focus{border-color:var(--accent);background:var(--surface)}
.input::placeholder{color:var(--text-3)}
.btn{width:100%;background:var(--accent);color:var(--accent-text);border-radius:14px;padding:14px;font-size:15px;font-weight:600;transition:opacity .15s}
.btn:active:not(:disabled){opacity:.72}
.btn-sub{width:100%;background:var(--surface);color:var(--text);border-radius:14px;padding:13px;font-size:14px;font-weight:600;box-shadow:var(--shadow)}
.txt-danger{color:var(--danger)}
.notice{border-radius:12px;padding:12px 13px;font-size:12px;line-height:1.55;white-space:pre-line}
.notice.warn{background:var(--surface);color:var(--danger);box-shadow:var(--shadow)}
.notice.info{background:var(--surface-2);color:var(--text-2)}
.hidden{display:none!important}

/* 마이페이지 */
.me{flex:1;overflow-y:auto;display:flex;flex-direction:column;padding-bottom:28px}
.banner{height:150px;position:relative;flex-shrink:0}
.banner-btn{position:absolute;top:12px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.92);color:#14171f;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.18)}
.banner-btn svg{width:16px;height:16px}
.banner-btn.l{left:12px}
.banner-btn.r{right:12px}
.avatar-wrap{position:absolute;left:50%;bottom:-42px;transform:translateX(-50%)}
.avatar-lg{width:88px;height:88px;border-radius:50%;border:4px solid var(--surface);overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:700;color:#fff}
.avatar-edit{position:absolute;right:-4px;bottom:0;width:28px;height:28px;border-radius:50%;background:var(--surface);border:1.5px solid var(--line);color:var(--text-2);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow)}
.avatar-edit svg{width:14px;height:14px}
.me-head{padding:54px 24px 0;display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center}
.me-name{font-size:20px;font-weight:800;letter-spacing:-.4px}
.me-bio{font-size:13px;color:var(--text-2);line-height:1.5}
.me-bio.empty{color:var(--text-3)}
.tags{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;padding:12px 24px 0}
.tag{padding:6px 12px;border-radius:999px;background:var(--surface-2);color:var(--text-2);font-size:12px;font-weight:600;border:1px solid var(--line)}
.tag.add{background:var(--surface);border:1.5px dashed var(--line);color:var(--text-3)}
.stats{display:flex;justify-content:center;gap:36px;padding:18px 20px 0}
.stat{text-align:center}
.stat-n{font-size:17px;font-weight:800}
.stat-l{font-size:11px;color:var(--text-2)}
.stat-div{width:1px;background:var(--line)}
.me-edit{padding:16px 20px 0}
.me-body{padding:20px 16px 0;display:flex;flex-direction:column;gap:10px}
.rowitem{display:flex;align-items:center;gap:12px;padding:13px 6px 13px 14px;border-bottom:1px solid var(--line-2)}
.rowitem:last-child{border-bottom:0}
.thumb{width:38px;height:38px;border-radius:10px;flex-shrink:0}
.rowitem-main{flex:1;min-width:0;text-align:left}
.kebab{width:32px;height:32px;border-radius:8px;color:var(--text-3);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.kebab svg{width:16px;height:16px}
.me-actions{display:flex;gap:10px;margin-top:2px}
.me-actions>*{flex:1;text-align:center}

/* 앱 */
.app{height:100vh;display:flex;flex-direction:column;overflow:hidden;position:relative}
.topbar{padding:14px 16px 10px;flex-shrink:0}
.topbar-row{display:flex;align-items:center;gap:9px}
.back-btn{width:32px;height:32px;border-radius:50%;background:var(--surface);color:var(--text-2);font-size:17px;line-height:1;flex-shrink:0;box-shadow:var(--shadow)}
.topbar h1{flex:1;min-width:0;font-size:19px;font-weight:800;letter-spacing:-.4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.owner-tag{display:inline-block;background:var(--accent-soft);color:var(--accent);font-size:9px;font-weight:700;padding:3px 7px;border-radius:5px;margin-left:6px;vertical-align:2px}
.nav-pick{display:flex;align-items:center;gap:2px;background:var(--surface);border-radius:999px;padding:5px 6px;flex-shrink:0;box-shadow:var(--shadow)}
.nav-btn{width:26px;height:26px;border-radius:50%;font-size:15px;color:var(--text-2);line-height:1}
.nav-btn:disabled{opacity:.25}
.nav-now{font-size:13px;font-weight:700;padding:0 6px;min-width:58px;text-align:center}

.seg{display:flex;background:var(--surface-3);border-radius:11px;padding:3px;margin:0 16px;flex-shrink:0}
.seg-btn{flex:1;padding:8px 0;font-size:13px;font-weight:600;color:var(--text-2);border-radius:9px;transition:all .18s}
.seg-btn.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}

/* 확정 배너 */
.dbanner{display:flex;align-items:center;gap:10px;margin:10px 16px 0;padding:10px 13px;background:var(--decided-soft);border:1.5px solid rgb(var(--decided));border-radius:12px;flex-shrink:0}
.dbanner svg{width:16px;height:16px;flex-shrink:0;color:rgb(var(--decided))}
.dbanner-main{min-width:0;flex:1}
.dbanner-t{font-size:12.5px;font-weight:700}
.dbanner-s{font-size:11px;color:rgb(var(--decided));margin-top:1px}

/* 응답 현황 */
.respbar{display:flex;align-items:center;gap:8px;margin:8px 16px 0;padding:8px 12px;background:var(--surface);border-radius:11px;box-shadow:var(--shadow);font-size:10.5px;color:var(--text-2);flex-shrink:0}
.respbar svg{width:14px;height:14px;flex-shrink:0;color:var(--text-3)}
.respbar b{color:var(--text)}

.toolbar{display:flex;gap:6px;margin:8px 16px 0;flex-shrink:0}
.tool{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 6px;border-radius:11px;background:var(--surface);color:var(--text-2);font-size:10px;font-weight:600;border:1.5px solid transparent;box-shadow:var(--shadow);transition:all .15s}
.tool svg{width:17px;height:17px}
.tool.on{border-color:rgb(var(--ok));color:rgb(var(--ok));background:rgba(var(--ok),.10)}
.tool.on.t-no{border-color:rgb(var(--no));color:rgb(var(--no));background:rgba(var(--no),.10)}
.tool.on.t-neutral{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.tool.on.t-dec{border-color:rgb(var(--decided));color:rgb(var(--decided));background:rgba(var(--decided),.10)}

.legend{display:flex;align-items:center;gap:13px;margin:8px 16px 0;padding:8px 12px;background:var(--surface);border-radius:11px;box-shadow:var(--shadow);flex-shrink:0}
.legend-item{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--text-2)}
.legend-ramp{width:22px;height:9px;border-radius:3px;background:linear-gradient(90deg,rgba(var(--heat),.16),rgb(var(--heat)))}
.legend-hatch{width:14px;height:9px;border-radius:3px;border:1px solid var(--line);background:repeating-linear-gradient(45deg,rgba(var(--hatch),var(--hatch-a)) 0 1.5px,transparent 1.5px 5px)}
.legend-dec{width:14px;height:9px;border-radius:3px;border:2px solid rgb(var(--decided))}
.legend-mine{width:14px;height:9px;border-radius:2px;background:rgba(var(--ok),var(--ok-a));border:1.5px solid rgb(var(--ok))}
.legend-mine.no{background:rgba(var(--no),var(--no-a));border-color:rgb(var(--no))}

.view{flex:1;overflow-y:auto;min-height:0}
.view-pad{padding:14px 16px 24px;display:flex;flex-direction:column;gap:18px}

/* 주간 그리드 */
.grid-wrap{flex:1;overflow:auto;min-height:0;background:var(--surface);margin:10px 12px 0;border-radius:16px 16px 0 0}
.grid{display:grid;grid-template-columns:2.1rem repeat(7,minmax(1.5rem,1fr))}
.dh{background:var(--surface);position:sticky;top:0;z-index:10;text-align:center;font-size:11px;color:var(--text-2);padding:9px 0 7px;font-weight:600;border-bottom:1px solid var(--grid-line)}
.tl{font-size:8.5px;color:var(--text-2);text-align:right;padding-right:4px;line-height:20px;font-variant-numeric:tabular-nums}
.tl.dawn{background:var(--tl-dawn)}
.tl.day{background:var(--tl-day)}
.tl.evening{background:var(--tl-evening)}
.tl.night{background:var(--tl-night)}
.cell{height:20px;position:relative;border-bottom:.5px solid var(--grid-line);border-left:.5px solid var(--grid-line)}
.cell.half{border-bottom:.5px solid var(--grid-half)}
.cell.daypart,.tl.boundary{border-top:1.5px solid var(--grid-hour)}
.cell i{position:absolute;inset:0;display:block;box-sizing:border-box}
.cell .hatch{background:repeating-linear-gradient(45deg,rgba(var(--hatch),var(--hatch-a)) 0 1.5px,transparent 1.5px 5px)}
.cell .mine{z-index:3;border-style:solid;border-width:0;border-color:transparent}
.cell .dec{z-index:6;border-style:solid;border-width:0;border-color:transparent}
.grid.drawing .cell{cursor:pointer;touch-action:none}
.grid.tappable .cell{cursor:pointer}
.cell.picked{box-shadow:inset 0 0 0 2px var(--accent);z-index:7}
.badge{position:absolute;bottom:1px;right:2px;font-size:7.5px;font-weight:900;z-index:5;line-height:1}
.dtag{position:absolute;left:1px;top:0;font-size:6.5px;font-weight:800;z-index:7;line-height:1.3;color:rgb(var(--decided));letter-spacing:-.2px}

/* 달력 */
.cal-wrap{flex:1;overflow:auto;min-height:0;background:var(--surface);margin:10px 12px 0;border-radius:16px 16px 0 0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;padding:10px 10px 16px}
.cal-dh{text-align:center;font-size:10.5px;font-weight:700;padding:4px 0 6px;color:var(--text-2)}
.cal-cell{position:relative;aspect-ratio:1/1.05;border-radius:7px;display:flex;flex-direction:column;align-items:center;padding-top:5px;gap:2px}
.cal-cell.blank{visibility:hidden}
.cal-cell i{position:absolute;inset:0;display:block;box-sizing:border-box;border-radius:7px}
.cal-cell .hatch{background:repeating-linear-gradient(45deg,rgba(var(--hatch),var(--hatch-a)) 0 1.5px,transparent 1.5px 5px)}
.cal.drawing .cal-cell{cursor:pointer;touch-action:none}
.cal.tappable .cal-cell{cursor:pointer}
.cal-n{position:relative;z-index:3;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;width:21px;height:21px;line-height:21px;text-align:center;border-radius:50%}
.cal-n.today{background:var(--text);color:var(--bg)!important}
.cal-tag{position:relative;z-index:3;font-size:7.5px;font-weight:700;line-height:1.1;text-align:center;padding:0 2px;max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.cal-cell b{position:absolute;bottom:3px;right:5px;font-size:9px;font-weight:900;z-index:4}
.cal-cell.picked{box-shadow:0 0 0 2px var(--accent);z-index:5}

/* 리스트 */
.rows{background:var(--surface);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:12px;padding:14px;border-bottom:1px solid var(--line-2);width:100%;text-align:left}
.row:last-child{border-bottom:0}
.row-main{flex:1;min-width:0}
.row-title{font-size:15px;font-weight:500}
.row-meta{font-size:11.5px;color:var(--text-2);margin-top:2px;word-break:break-all}
.row-val{font-size:13px;color:var(--text-2);flex-shrink:0;font-variant-numeric:tabular-nums}
.chev{color:var(--text-3);font-size:17px;flex-shrink:0;line-height:1}
.avatar{width:34px;height:34px;border-radius:50%;flex-shrink:0;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff}
.pend{display:inline-block;background:var(--surface-3);color:var(--text-2);font-size:9px;font-weight:700;padding:3px 7px;border-radius:5px;margin-left:6px;vertical-align:2px}
.empty{text-align:center;padding:48px 20px;color:var(--text-3);font-size:13px;line-height:1.6}

.theme-row{display:flex;gap:8px;padding:12px 14px}
.theme-opt{flex:1;border-radius:12px;padding:12px 8px;font-size:12.5px;font-weight:600;background:var(--surface-2);color:var(--text-2);border:1.5px solid transparent;display:flex;flex-direction:column;align-items:center;gap:6px}
.theme-opt.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.theme-opt svg{width:19px;height:19px}

/* 탭바 */
.tabbar{background:var(--surface);border-top:1px solid var(--line);display:flex;padding:6px 8px 8px;flex-shrink:0}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 0;color:var(--text-3);font-size:10px;font-weight:500;transition:color .15s}
.tab.on{color:var(--accent)}
.tab svg{width:22px;height:22px}
.viewic{display:flex;align-items:center;gap:4px;height:22px;perspective:260px}
.ic-main{width:22px;height:22px;display:block;transition:transform .11s ease-in,opacity .11s ease-in}
.ic-alt{width:14px;height:14px;display:block;color:var(--text-3);opacity:.5;transition:transform .11s ease-in,opacity .11s ease-in}
.ic-main svg,.ic-alt svg{width:100%;height:100%;display:block}
.viewic.flip .ic-main{transform:rotateY(90deg) scale(.7);opacity:.3}
.viewic.flip .ic-alt{transform:rotateY(90deg) scale(1.4);opacity:.9}

/* 시트 */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:none;align-items:flex-end;justify-content:center}
.overlay.show{display:flex}
.sheet{background:var(--bg);border-radius:22px 22px 0 0;width:100%;max-width:390px;max-height:88vh;display:flex;flex-direction:column}
.sheet-header{padding:16px 18px 12px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-shrink:0}
.sheet-header h2{font-size:18px;font-weight:800;letter-spacing:-.3px}
.sheet-close{width:30px;height:30px;border-radius:50%;background:var(--surface-3);color:var(--text-2);font-size:15px;line-height:1;flex-shrink:0}
.sheet-body{flex:1;overflow-y:auto;padding:0 16px}
.sheet-foot{padding:12px 16px 22px;flex-shrink:0;display:flex;flex-direction:column;gap:9px}
.foot-row{display:flex;gap:10px}
.foot-row>*{flex:1}

.cellinfo{position:absolute;left:16px;right:16px;bottom:74px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 15px;box-shadow:var(--shadow-pop);z-index:50}
.cellinfo-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.cellinfo-title{font-size:13px;font-weight:700}
.cellinfo-close{width:24px;height:24px;border-radius:50%;background:var(--surface-2);color:var(--text-2);font-size:12px;line-height:1;flex-shrink:0}
.cellinfo-row{display:flex;align-items:center;gap:6px;margin-top:9px}
.cellinfo-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.cellinfo-label{font-size:11.5px;font-weight:600}
.cellinfo-names{font-size:11px;color:var(--text-2);margin:3px 0 0 13px;line-height:1.5}

.pick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:2px 0 6px}
.pick{border-radius:14px;padding:10px 6px;background:var(--surface);border:1.5px solid transparent;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:7px;font-size:10.5px;font-weight:600;color:var(--text-2)}
.pick.on{border-color:var(--accent);color:var(--accent)}
.pick-av{width:46px;height:46px;border-radius:50%;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;color:#fff}
.pick-banner{width:100%;height:42px;border-radius:10px}
.color-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:2px 0 6px}
.color-opt{aspect-ratio:1;border-radius:14px;position:relative;border:2.5px solid transparent;display:flex;align-items:center;justify-content:center}
.color-opt.on{border-color:var(--text)}
.color-opt span{width:11px;height:11px;border-radius:50%;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.15)}

.week-card{background:var(--surface);border-radius:14px;margin-bottom:9px;overflow:hidden;cursor:pointer;border:1.5px solid transparent;box-shadow:var(--shadow)}
.week-card.active-card{border-color:var(--accent)}
.week-card-header{display:flex;align-items:center;justify-content:space-between;padding:11px 13px 9px;gap:8px}
.week-card-title{font-size:14px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.week-card-actions{display:flex;gap:2px;flex-shrink:0}
.wc-btn{width:27px;height:27px;border-radius:7px;color:var(--text-2);font-size:12px;background:var(--surface-2)}
.mini-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding:0 12px 12px}
.mini-col{display:flex;flex-direction:column;gap:1px}
.mini-day{font-size:8px;color:var(--text-3);text-align:center;margin-bottom:3px}
.mini-cell{height:3px;border-radius:1px;background:var(--surface-2)}

.menu-item{width:100%;text-align:left;padding:15px 16px;font-size:15px;border-bottom:1px solid var(--line-2)}
.menu-item:last-child{border-bottom:0}
</style>
</head>
<body>
<div class="shell">

  <!-- ============ 마이페이지 ============ -->
  <section class="me" id="me">
    <div class="banner" id="banner">

/* ---------- 프로필 ---------- */
function blankProfile(){return{name:'',bio:'',tags:[],pattern:0,banner:0,color:null};}
function loadProfileCache(){
  try{const p=JSON.parse(localStorage.getItem(PROFILE_CACHE_KEY)||'null');
    return p?{...blankProfile(),...p}:blankProfile();}catch{return blankProfile();}
}
function saveProfileCache(){localStorage.setItem(PROFILE_CACHE_KEY,JSON.stringify(profile));}
async function loadMyProfile(){
  try{
    const snap=await getDoc(doc(db,'profiles',user.uid));
    if(snap.exists()){profile={...blankProfile(),...snap.data()};saveProfileCache();}
    else if(profile.name){await saveProfile();}
    profileCache[user.uid]=profile;
  }catch(e){window.alert(fmtErr(e));}
}
async function saveProfile(){
  saveProfileCache();
  if(user)profileCache[user.uid]=profile;
  if(!db||!user)return;
  try{
    await setDoc(doc(db,'profiles',user.uid),{
      name:profile.name||'',bio:profile.bio||'',
      tags:Array.isArray(profile.tags)?profile.tags.slice(0,MAX_TAGS):[],
      pattern:profile.pattern|0,banner:profile.banner|0,
      color:profile.color===null?null:(profile.color|0),
      updatedAt:serverTimestamp(),
    },{merge:true});
  }catch(e){window.alert(fmtErr(e));}
}
async function fetchProfiles(uids){
  const need=uids.filter(u=>!(u in profileCache));
  if(!need.length)return;
  await Promise.all(need.map(async u=>{
    try{const snap=await getDoc(doc(db,'profiles',u));
      profileCache[u]=snap.exists()?{...blankProfile(),...snap.data()}:blankProfile();
    }catch{profileCache[u]=blankProfile();}
  }));
}
function colorOf(uid,fallbackCi){
  const p=profileCache[uid];
  if(p&&p.color!==null&&p.color!==undefined)return p.color%COLORS.length;
  if(typeof fallbackCi==='number')return fallbackCi%COLORS.length;
  return uid?ciForUid(uid):0;
}
function myColorIndex(){
  if(profile.color!==null&&profile.color!==undefined)return profile.color%COLORS.length;
  return user?ciForUid(user.uid):0;
}

function paintAvatar(node,{ci,pattern,initial,size}){
  const c=COLORS[(ci||0)%COLORS.length];
  node.innerHTML='';node.style.background=c.solid;
  const p=(pattern|0)%4;
  if(p===0){node.textContent=initial||'?';return;}
  const ov=document.createElement('i');
  ov.style.cssText='position:absolute;inset:0;display:block';
  if(p===1){const w=Math.max(4,Math.round(size/9));
    ov.style.background=`repeating-linear-gradient(45deg,${c.light} 0 ${w}px,transparent ${w}px ${w*2}px)`;}
  else if(p===2){const r=Math.max(5,Math.round(size/7));
    ov.style.background=`repeating-radial-gradient(circle at 50% 50%,${c.light} 0 ${r}px,transparent ${r}px ${r*2}px)`;}
  else{const w=Math.max(4,Math.round(size/10));
    ov.style.background=`repeating-linear-gradient(0deg,${c.light} 0 ${w}px,transparent ${w}px ${w*2}px),repeating-linear-gradient(90deg,${c.light} 0 ${w}px,transparent ${w}px ${w*2}px)`;
    ov.style.opacity='.75';}
  node.appendChild(ov);
}
function bannerStyle(idx,ci){
  const c=COLORS[(ci||0)%COLORS.length];
  const css=getComputedStyle(document.documentElement);
  const accent=css.getPropertyValue('--accent').trim();
  const neutral=css.getPropertyValue('--neutral-banner').trim();
  const ok=css.getPropertyValue('--ok').trim();
  switch((idx|0)%6){
    case 0:return c.solid;
    case 1:return accent;
    case 2:return neutral;
    case 3:return `linear-gradient(135deg,${c.solid},${c.light})`;
    case 4:return `linear-gradient(135deg,rgb(${ok}),${accent})`;
    default:return `radial-gradient(circle at 50% 50%,rgba(255,255,255,.22) 0 2px,transparent 2px 9px), ${c.solid}`;
  }
}

function bindEvents(){
  el.themeBtn.addEventListener('click',cycleTheme);
  el.bannerBtn.addEventListener('click',openBannerPicker);
  el.avatarBtn.addEventListener('click',openAvatarPicker);
  el.editProfileBtn.addEventListener('click',openProfileEdit);
  el.openCreateBtn.addEventListener('click',openCreateSheet);
  el.openJoinBtn.addEventListener('click',openJoinSheet);
  el.backBtn.addEventListener('click',()=>leaveRoom(false));
  el.prevNav.addEventListener('click',()=>step(-1));
  el.nextNav.addEventListener('click',()=>step(1));
  el.mtEdit.addEventListener('click',()=>setMode('edit'));
  el.mtOverview.addEventListener('click',()=>setMode('overview'));
  el.btView.addEventListener('click',()=>{
    if(tab==='main')switchView();
    else selectTab('main');
  });
  el.btPeople.addEventListener('click',()=>selectTab('people'));
  el.btSettings.addEventListener('click',()=>selectTab('settings'));
  el.cellinfoClose.addEventListener('click',closeCellInfo);
  el.sheetClose.addEventListener('click',closeSheet);
  el.overlay.addEventListener('click',e=>{if(e.target===el.overlay)closeSheet();});

  [[el.grid,'.cell'],[el.cal,'.cal-cell']].forEach(([node,sel])=>{
    node.addEventListener('pointerdown',e=>onDown(e,node,sel));
    node.addEventListener('contextmenu',e=>{
      const c=e.target.closest?.(sel);
      if(!c||!c.dataset.key)return;
      if(node===el.cal&&isOwner()){e.preventDefault();openSpecialDay(c.dataset.key);}
    });
  });
  document.addEventListener('pointermove',e=>{
    if(pressTimer){clearTimeout(pressTimer);pressTimer=null;}
    if(!drag||!dragTarget)return;
    e.preventDefault();
    const t=document.elementFromPoint(e.clientX,e.clientY);
    const c=t&&t.closest?t.closest(dragTarget.sel):null;
    if(c&&c.dataset.key)paint(c.dataset.key);
  },{passive:false});
  document.addEventListener('pointerup',e=>{
    if(pressTimer){clearTimeout(pressTimer);pressTimer=null;}
    if(drag){commit();drag=false;dragTarget=null;return;}
    if(tapStart){
      const moved=Math.hypot(e.clientX-tapStart.x,e.clientY-tapStart.y);
      if(moved<=TAP_SLOP)openCellInfo(tapStart.key);
      tapStart=null;
    }
  });
  document.addEventListener('pointercancel',()=>{
    if(pressTimer){clearTimeout(pressTimer);pressTimer=null;}
    if(drag)commit();
    drag=false;dragTarget=null;tapStart=null;
  });
}

function onDown(e,node,sel){
  const c=e.target.closest?.(sel);
  if(!c||!c.dataset.key)return;
  const key=c.dataset.key;
  /* 이동 모드 */
  if(tool==='move'){
    if(mode==='overview'){tapStart={x:e.clientX,y:e.clientY,key};}
    if(node===el.cal&&isOwner()){
      pressTimer=setTimeout(()=>{pressTimer=null;tapStart=null;openSpecialDay(key);},LONG_PRESS);
    }
    return;
  }
  /* 그리기 */
  if(mode==='edit'&&!getMe())return;
  if(mode==='overview'&&!isOwner())return;
  e.preventDefault();
  drag=true;dragTarget={sel};
  paint(key);
}

function paint(key){
  if(mode==='overview')applyDecided(key);
  else applyTool(key);
}
function commit(){
  if(mode==='overview')saveDecidedNow();
  else saveNow();
}

/* ---------- 방 ---------- */
async function createRoom(title,ownerName,pw,btn){
  if(!requireFB())return;
  title=title||'새 방';
  ownerName=ownerName||profile.name||'방장';
  if(pw.length<4){window.alert('비밀번호는 4자 이상이어야 해요.');return;}
  try{
    btn.disabled=true;
    const roomRef=doc(collection(db,'rooms'));
    const code=await makeCode();
    const codeHash=await sha256(code);
    const pwHash=await sha256(pw);
    const batch=writeBatch(db);
    batch.set(roomRef,{title,createdBy:user.uid,createdAt:serverTimestamp(),updatedAt:serverTimestamp(),
      weekLabels:DEFAULT_WEEKS,specialDays:{},decided:{},decidedDates:[]});
    batch.set(doc(db,'roomCodes',codeHash),{roomId:roomRef.id,createdBy:user.uid,createdAt:serverTimestamp()});
    batch.set(doc(db,'roomSecrets',roomRef.id),{roomId:roomRef.id,entryCode:code,codeHash,passwordHash:pwHash,createdBy:user.uid,createdAt:serverTimestamp()});
    batch.set(doc(db,'rooms',roomRef.id,'members',user.uid),{uid:user.uid,name:ownerName,ci:myColorIndex(),schedules:{},dates:{ok:[],no:[]},joinedAt:serverTimestamp(),updatedAt:serverTimestamp()});
    await batch.commit();
    if(!profile.name){profile.name=ownerName;await saveProfile();}
    rememberAdminRoom({roomId:roomRef.id,title,entryCode:code});
    closeSheet();
    window.alert(`방을 만들었어요\n\n입장 번호: ${code}\n\n이 번호를 팀원에게 알려주세요.\n(설정 탭에서 다시 볼 수 있어요)`);
    saveSession(roomRef.id);enterRoom(roomRef.id);
  }catch(e){window.alert(fmtErr(e));}
  finally{btn.disabled=false;}
}

async function makeCode(){
  for(let i=0;i<12;i++){
    const c=String(Math.floor(100000+Math.random()*900000));
    const snap=await getDoc(doc(db,'roomCodes',await sha256(c)));
    if(!snap.exists())return c;
  }
  throw new Error('고유 코드 생성에 실패했어요.');
}

async function joinRoom(code,name,btn){
  if(!requireFB())return;
  if(!/^\d{6}$/.test(code)){window.alert('6자리 숫자를 입력해주세요.');return;}
  if(!name){window.alert('이름을 입력해주세요.');return;}
  try{
    btn.disabled=true;
    const codeSnap=await getDoc(doc(db,'roomCodes',await sha256(code)));
    if(!codeSnap.exists()){window.alert('입장 번호가 맞지 않아요.');return;}
    const roomId=codeSnap.data().roomId;
    const ci=myColorIndex();
    await runTransaction(db,async tx=>{
      const roomRef=doc(db,'rooms',roomId);
      const memberRef=doc(db,'rooms',roomId,'members',user.uid);
      const rSnap=await tx.get(roomRef);
      if(!rSnap.exists())throw new Error('방이 존재하지 않아요.');
      const mSnap=await tx.get(memberRef);
      if(mSnap.exists()){tx.update(memberRef,{name,ci,updatedAt:serverTimestamp()});return;}
      tx.set(memberRef,{uid:user.uid,name,ci,schedules:{},dates:{ok:[],no:[]},joinedAt:serverTimestamp(),updatedAt:serverTimestamp()});
    });
    if(!profile.name){profile.name=name;await saveProfile();}
    closeSheet();saveSession(roomId);enterRoom(roomId);
  }catch(e){window.alert(fmtErr(e));}
  finally{btn.disabled=false;}
}

function enterRoom(roomId){
  closeWatchers();
  room={id:roomId,title:'',weekLabels:DEFAULT_WEEKS,createdBy:null,specialDays:{},decided:{},decidedDates:[]};
  people=[];curWeek=0;firstScroll=false;cachedEntryCode=null;
  const now=new Date();calY=now.getFullYear();calM=now.getMonth();
  view='grid';renderViewIcons();
  setMode('edit');setTool('move');selectTab('main');
  el.me.classList.add('hidden');el.app.classList.remove('hidden');

  roomUnsub=onSnapshot(doc(db,'rooms',roomId),snap=>{
    if(!snap.exists()){
      forgetAdminRoom(roomId);forgetVisited(roomId);
      leaveRoom(true);window.alert('방이 삭제되었어요.');return;
    }
    const d=snap.data();
    room={id:snap.id,title:d.title||'팀 스케줄러',createdBy:d.createdBy,
      weekLabels:Array.isArray(d.weekLabels)&&d.weekLabels.length?d.weekLabels:DEFAULT_WEEKS,
      specialDays:d.specialDays||{},decided:d.decided||{},
      decidedDates:Array.isArray(d.decidedDates)?d.decidedDates:[]};
    if(curWeek>=room.weekLabels.length)curWeek=room.weekLabels.length-1;
    rememberVisited(room.id,room.title);
    syncBars();renderBoard();
    if(tab==='settings')renderSettings();
  },e=>window.alert(fmtErr(e)));

  membersUnsub=onSnapshot(
    query(collection(db,'rooms',roomId,'members'),orderBy('joinedAt','asc')),
    async snap=>{
      people=snap.docs.map(d=>({id:d.id,...d.data(),schedules:d.data().schedules||{},dates:d.data().dates||{ok:[],no:[]}}));
      renderBoard();
      if(pickedKey)renderCellInfo();
      if(tab==='settings')renderSettings();
      if(tab==='people'){
        renderPeople();
        await fetchProfiles(people.map(p=>p.id));
        if(tab==='people')renderPeople();
      }
    },e=>window.alert(fmtErr(e))
  );
}

function leaveRoom(clear=true){
  closeWatchers();
  room=null;people=[];drag=false;dragTarget=null;tapStart=null;cachedEntryCode=null;
  closeCellInfo();
  if(clear)clearSession();
  closeSheet();
  el.app.classList.add('hidden');el.me.classList.remove('hidden');
  renderMe();
}
function closeWatchers(){
  if(roomUnsub)roomUnsub();
  if(membersUnsub)membersUnsub();
  roomUnsub=membersUnsub=null;
}

  if(t==='main')renderBoard();
  if(t==='people'){
    renderPeople();
    fetchProfiles(people.map(p=>p.id)).then(()=>{if(tab==='people')renderPeople();});
  }
  if(t==='settings')renderSettings();
}

/* ---------- 배너 / 응답 현황 ---------- */
function renderBanners(){
  if(!room||tab!=='main'){el.dbanner.classList.add('hidden');el.respbar.classList.add('hidden');return;}
  /* 확정 */
  let txt='',sub='';
  if(view==='grid'){
    const slots=getDecided(curWeek);
    if(slots.size){
      const ranges=slotRanges([...slots]);
      txt=ranges.slice(0,2).map(r=>`${r.day} ${r.from}–${r.to}`).join(', ');
      if(ranges.length>2)txt+=` 외 ${ranges.length-2}건`;
      sub=`${room.weekLabels[curWeek]||''} 확정`;
    }
  } else {
    const inMonth=(room.decidedDates||[]).filter(k=>{const d=parseKey(k);return d.y===calY&&d.m===calM;}).sort();
    if(inMonth.length){
      txt=inMonth.slice(0,3).map(k=>{const d=parseKey(k);return `${d.m+1}/${d.d}`;}).join(', ');
      if(inMonth.length>3)txt+=` 외 ${inMonth.length-3}일`;
      sub='확정된 날짜';
    }
  }
  el.dbanner.classList.toggle('hidden',!txt);
  if(txt){el.dbannerT.textContent=txt;el.dbannerS.textContent=sub;}

  /* 응답 현황 */
  if(!people.length){el.respbar.classList.add('hidden');return;}
  const pending=people.filter(p=>!hasInput(p)).map(p=>p.name||'이름 없음');
  const done=people.length-pending.length;
  el.respbar.classList.remove('hidden');
  el.respbarT.innerHTML=pending.length
    ? `${people.length}명 중 <b>${done}명</b> 응답 · ${esc(pending.slice(0,3).join(', '))}${pending.length>3?` 외 ${pending.length-3}명`:''} 미입력`
    : `<b>${people.length}명 전원</b> 응답 완료`;
}

function hasInput(p){
  if(view==='grid'){
    const s=getSlots(p,curWeek);
    return s.ok.size>0||s.no.size>0;
  }
  const d=getDates(p);
  const inMonth=k=>{const x=parseKey(k);return x.y===calY&&x.m===calM;};
  return [...d.ok].some(inMonth)||[...d.no].some(inMonth);
}

function slotRanges(slots){
  const byDay={};
  slots.forEach(k=>{
    const i=k.indexOf('-');
    const dk=k.slice(0,i),t=k.slice(i+1);
    (byDay[dk]=byDay[dk]||[]).push(TIMES.indexOf(t));
  });
  const out=[];
  DKEYS.forEach(dk=>{
    if(!byDay[dk])return;
    const idx=byDay[dk].filter(x=>x>=0).sort((a,b)=>a-b);
    let s=idx[0],prev=idx[0];
    for(let i=1;i<=idx.length;i++){
      if(i<idx.length&&idx[i]===prev+1){prev=idx[i];continue;}
      out.push({day:DAYS[DKEYS.indexOf(dk)],from:TIMES[s],to:endOf(prev)});
      s=idx[i];prev=idx[i];
    }
  });
  return out;
}
function endOf(i){
  if(i+1<TIMES.length)return TIMES[i+1];
  const [h,m]=TIMES[i].split(':').map(Number);
  const t=(h*60+m+30)%1440;
  return `${String(Math.floor(t/60)).padStart(2,'0')}:${String(t%60).padStart(2,'0')}`;
}

/* ---------- 네비게이션 ---------- */
function step(dir){
  if(!room)return;
  if(view==='grid'){
    const i=curWeek+dir;
    if(i<0||i>=room.weekLabels.length)return;
    curWeek=i;
  } else {
    calM+=dir;
    if(calM<0){calM=11;calY--;}
    if(calM>11){calM=0;calY++;}
  }
  closeCellInfo();renderBoard();
}

/* ---------- 보드 렌더 ---------- */
function renderBoard(){
  if(!room)return;
  el.roomTitleLabel.textContent=room.title;
  if(view==='grid'){
    el.navLabel.textContent=room.weekLabels[curWeek]||'1주차';
    el.prevNav.disabled=curWeek<=0;
    el.nextNav.disabled=curWeek>=room.weekLabels.length-1;
    renderGrid();
  } else {
    el.navLabel.textContent=`${calY}.${String(calM+1).padStart(2,'0')}`;
    el.prevNav.disabled=false;el.nextNav.disabled=false;
    renderCalendar();
  }
  renderBanners();
  renderLegend();
}

function themeVals(){
  const css=getComputedStyle(document.documentElement);
  return{
    heat:css.getPropertyValue('--heat').trim(),
    heatMax:parseFloat(css.getPropertyValue('--heat-max'))||.8,
    bgScale:parseFloat(css.getPropertyValue('--bg-heat-scale'))||.34,
    ok:css.getPropertyValue('--ok').trim(),
    no:css.getPropertyValue('--no').trim(),
    dec:css.getPropertyValue('--decided').trim(),
    okA:css.getPropertyValue('--ok-a').trim()||'.34',
    noA:css.getPropertyValue('--no-a').trim()||'.32',
  };
}

function renderGrid(){
  const v=themeVals();
  const me=getMe();
  el.grid.innerHTML='';
  const corner=document.createElement('div');corner.className='dh';el.grid.appendChild(corner);
  DAYS.forEach(d=>{const h=document.createElement('div');h.className='dh';h.textContent=d;el.grid.appendChild(h);});

  const mine=me?getSlots(me,curWeek):{ok:new Set(),no:new Set()};
  const dec=getDecided(curWeek);
  const cache=people.map(p=>({p,s:getSlots(p,curWeek)}));
  const allTotal=Math.max(people.length,1);
  const editable=(mode==='edit'&&Boolean(me))||(mode==='overview');

  const keyAt=(di,ti)=>(di<0||di>6||ti<0||ti>=TIMES.length)?null:`${DKEYS[di]}-${TIMES[ti]}`;
  const inSet=(set,di,ti)=>{const k=keyAt(di,ti);return k?set.has(k):false;};

  let prevPart=null;
  TIMES.forEach((t,ti)=>{
    const part=daypartOf(t);
    const bnd=prevPart!==null&&part!==prevPart;
    prevPart=part;
    const tl=document.createElement('div');
    tl.className=`tl ${part}${bnd?' boundary':''}`;
    tl.textContent=ti%2===0?t:'';
    el.grid.appendChild(tl);

    DKEYS.forEach((dk,di)=>{
      const key=`${dk}-${t}`;
      const cell=document.createElement('div');
      cell.className=`cell${ti%2?' half':''}${bnd?' daypart':''}${key===pickedKey?' picked':''}`;
      if(editable)cell.dataset.key=key;

      if(mode==='edit'){
        const isOk=mine.ok.has(key),isNo=mine.no.has(key);
        if(isOk||isNo){
          const set=isOk?mine.ok:mine.no;
          const rgb=isOk?v.ok:v.no, al=isOk?v.okA:v.noA;
          const l=document.createElement('i');l.className='mine';
          l.style.background=`rgba(${rgb},${al})`;
          if(!inSet(set,di,ti-1))l.style.borderTopWidth='1.5px';
          if(!inSet(set,di,ti+1))l.style.borderBottomWidth='1.5px';
          if(!inSet(set,di-1,ti))l.style.borderLeftWidth='1.5px';
          if(!inSet(set,di+1,ti))l.style.borderRightWidth='1.5px';
          l.style.borderColor=`rgb(${rgb})`;
          cell.appendChild(l);
        }
      } else {
        let okCnt=0,noCnt=0;
        cache.forEach(({s})=>{if(s.ok.has(key))okCnt++;if(s.no.has(key))noCnt++;});
        if(okCnt>0){
          const a=((v.heatMax/allTotal)*okCnt).toFixed(2);
          const l=document.createElement('i');l.style.cssText=`background:rgba(${v.heat},${a})`;cell.appendChild(l);
        }
        if(noCnt>0){const h=document.createElement('i');h.className='hatch';cell.appendChild(h);}
        if(okCnt>=2){
          const b=document.createElement('span');b.className='badge';b.textContent=okCnt;
          b.style.color=okCnt/allTotal>0.55?'#fff':`rgb(${v.heat})`;
          cell.appendChild(b);
        }
      }

      /* 확정 윤곽 — 항상 맨 위 */
      if(dec.has(key)){
        const l=document.createElement('i');l.className='dec';
        const top=!inSet(dec,di,ti-1);
        if(top)l.style.borderTopWidth='2.5px';
        if(!inSet(dec,di,ti+1))l.style.borderBottomWidth='2.5px';
        if(!inSet(dec,di-1,ti))l.style.borderLeftWidth='2.5px';
        if(!inSet(dec,di+1,ti))l.style.borderRightWidth='2.5px';
        l.style.borderColor=`rgb(${v.dec})`;
        cell.appendChild(l);
        if(top){const s=document.createElement('span');s.className='dtag';s.textContent='확정';cell.appendChild(s);}
      }
      el.grid.appendChild(cell);
    });
  });
  if(!firstScroll){firstScroll=true;setTimeout(()=>{el.viewGrid.scrollTop=20*6;},60);}
}

/* ---------- 달력 ---------- */
function pad2(n){return String(n).padStart(2,'0');}
function dateKey(y,m,d){return `${y}-${pad2(m+1)}-${pad2(d)}`;}
function parseKey(k){const[a,b,c]=k.split('-').map(Number);return{y:a,m:b-1,d:c};}
function weekdayMon(o){const w=new Date(o.y,o.m,o.d).getDay();return (w+6)%7;}

function renderCalendar(){
  const v=themeVals();
  const me=getMe();
  el.cal.innerHTML='';
  DAYS.forEach((n,i)=>{
    const h=document.createElement('div');h.className='cal-dh';h.textContent=n;
    if(i===5)h.style.color='var(--sat)';
    if(i===6)h.style.color='var(--sun)';
    el.cal.appendChild(h);
  });
  const first=new Date(calY,calM,1);
  const lead=(first.getDay()+6)%7;
  const ndays=new Date(calY,calM+1,0).getDate();
  for(let i=0;i<lead;i++){
    const b=document.createElement('div');b.className='cal-cell blank';el.cal.appendChild(b);
  }
  const mine=me?getDates(me):{ok:new Set(),no:new Set()};
  const cache=people.map(p=>({p,d:getDates(p)}));
  const allTotal=Math.max(people.length,1);
  const decSet=new Set(room.decidedDates||[]);
  const editable=(mode==='edit'&&Boolean(me))||(mode==='overview');
  const today=new Date();
  const todayKey=dateKey(today.getFullYear(),today.getMonth(),today.getDate());

  for(let d=1;d<=ndays;d++){
    const key=dateKey(calY,calM,d);
    const wd=(new Date(calY,calM,d).getDay()+6)%7;
    const hol=HOLIDAYS[key];
    const sp=(room.specialDays||{})[key];
    const cell=document.createElement('div');
    cell.className=`cal-cell${key===pickedKey?' picked':''}`;
    if(editable||isOwner())cell.dataset.key=key;

    if(mode==='edit'){
      if(mine.ok.has(key)){
        const l=document.createElement('i');
        l.style.cssText=`background:rgba(${v.ok},${v.okA});border:1.5px solid rgb(${v.ok})`;cell.appendChild(l);
      } else if(mine.no.has(key)){
        const l=document.createElement('i');
        l.style.cssText=`background:rgba(${v.no},${v.noA});border:1.5px solid rgb(${v.no})`;cell.appendChild(l);
      }
    } else {
      let okCnt=0,noCnt=0;
      cache.forEach(({d:dd})=>{if(dd.ok.has(key))okCnt++;if(dd.no.has(key))noCnt++;});
      if(okCnt>0){
        const a=((v.heatMax/allTotal)*okCnt).toFixed(2);
        const l=document.createElement('i');l.style.cssText=`background:rgba(${v.heat},${a})`;cell.appendChild(l);
      }
      if(noCnt>0){const h=document.createElement('i');h.className='hatch';cell.appendChild(h);}
      if(okCnt>=2){
        const b=document.createElement('b');b.textContent=okCnt;
        b.style.color=okCnt/allTotal>0.55?'#fff':`rgb(${v.heat})`;
        cell.appendChild(b);
      }
    }
    if(decSet.has(key)){
      const l=document.createElement('i');
      l.style.cssText=`border:2.5px solid rgb(${v.dec})`;cell.appendChild(l);
    }

    const n=document.createElement('span');
    n.className=`cal-n${key===todayKey?' today':''}`;
    n.textContent=d;
    n.style.color=(hol||wd===6)?'var(--sun)':(wd===5?'var(--sat)':'var(--text)');
    cell.appendChild(n);

    if(sp||hol){
      const tg=document.createElement('span');tg.className='cal-tag';
      tg.textContent=sp||hol;
      tg.style.color=sp?`rgb(${v.dec})`:'var(--sun)';
      cell.appendChild(tg);
    }
    el.cal.appendChild(cell);
  }
}

/* ---------- 셀 상세 ---------- */
function openCellInfo(key){pickedKey=key;renderCellInfo();el.cellinfo.classList.remove('hidden');renderBoard();}
function closeCellInfo(){
  if(!pickedKey)return;
  pickedKey=null;el.cellinfo.classList.add('hidden');
  if(room)renderBoard();
}
function renderCellInfo(){
  if(!pickedKey||!room)return;
  const okNames=[],noNames=[];
  if(view==='grid'){
    const i=pickedKey.indexOf('-');
    el.cellinfoTitle.textContent=`${DAY_LABEL[pickedKey.slice(0,i)]||''} ${pickedKey.slice(i+1)}`;
    people.forEach(p=>{
      const s=getSlots(p,curWeek);
      if(s.ok.has(pickedKey))okNames.push(p.name||'이름 없음');
      else if(s.no.has(pickedKey))noNames.push(p.name||'이름 없음');
    });
  } else {
    const o=parseKey(pickedKey);
    const extra=(room.specialDays||{})[pickedKey]||HOLIDAYS[pickedKey]||'';
    el.cellinfoTitle.textContent=`${o.m+1}월 ${o.d}일 (${DAYS[weekdayMon(o)]})${extra?` · ${extra}`:''}`;
    people.forEach(p=>{
      const d=getDates(p);
      if(d.ok.has(pickedKey))okNames.push(p.name||'이름 없음');
      else if(d.no.has(pickedKey))noNames.push(p.name||'이름 없음');
    });
  }
  el.cellinfoBody.innerHTML='';
  if(!okNames.length&&!noNames.length){
    const d=document.createElement('div');
    d.style.cssText='font-size:11.5px;color:var(--text-2);margin-top:9px';
    d.textContent='아직 아무도 입력하지 않았어요.';
    el.cellinfoBody.appendChild(d);return;
  }
  const v=themeVals();
  const block=(color,label,names)=>{
    if(!names.length)return;
    const r=document.createElement('div');r.className='cellinfo-row';
    const dot=document.createElement('span');dot.className='cellinfo-dot';dot.style.background=color;
    const lab=document.createElement('span');lab.className='cellinfo-label';lab.textContent=`${label} ${names.length}명`;
    r.appendChild(dot);r.appendChild(lab);
    const nm=document.createElement('div');nm.className='cellinfo-names';nm.textContent=names.join(', ');
    el.cellinfoBody.appendChild(r);el.cellinfoBody.appendChild(nm);
  };
  block(`rgb(${v.ok})`,'가능',okNames);
  block(`rgb(${v.no})`,'불가',noNames);
}

/* ---------- 주차 ---------- */
async function addWeek(){
  if(!room||!isOwner())return;
  const labels=[...room.weekLabels,`${room.weekLabels.length+1}주차`];
  try{
    await updateDoc(doc(db,'rooms',room.id),{weekLabels:labels,updatedAt:serverTimestamp()});
    curWeek=labels.length-1;renderWeekSheet();
  }catch(e){window.alert(fmtErr(e));}
}
async function deleteWeek(i,e){
  e.stopPropagation();
  if(!room||!isOwner()||room.weekLabels.length<=1)return;
  if(!window.confirm(`"${room.weekLabels[i]}"를 삭제할까요?`))return;
  const labels=room.weekLabels.filter((_,j)=>j!==i);
  try{
    await updateDoc(doc(db,'rooms',room.id),{weekLabels:labels,updatedAt:serverTimestamp()});
    if(curWeek>=labels.length)curWeek=labels.length-1;
    renderWeekSheet();
  }catch(err){window.alert(fmtErr(err));}
}
async function moveWeek(i,dir,e){
  e.stopPropagation();
  if(!room||!isOwner())return;
  const j=i+dir;if(j<0||j>=room.weekLabels.length)return;
  const labels=[...room.weekLabels];
  [labels[i],labels[j]]=[labels[j],labels[i]];
  try{
    await updateDoc(doc(db,'rooms',room.id),{weekLabels:labels,updatedAt:serverTimestamp()});
    if(curWeek===i)curWeek=j;else if(curWeek===j)curWeek=i;
    renderWeekSheet();
  }catch(err){window.alert(fmtErr(err));}
}
async function renameWeek(i,e){
  e.stopPropagation();
  if(!room||!isOwner())return;
  const val=window.prompt('주차 이름',room.weekLabels[i]);
  if(val===null)return;
  const name=norm(val,20);if(!name)return;
  const labels=[...room.weekLabels];labels[i]=name;
  try{
    await updateDoc(doc(db,'rooms',room.id),{weekLabels:labels,updatedAt:serverTimestamp()});
    renderWeekSheet();
  }catch(err){window.alert(fmtErr(err));}
}
function openWeekSheet(){openSheet('주차 관리');renderWeekSheet();}
function renderWeekSheet(){
  if(!room)return;
  el.sheetBody.innerHTML='';el.sheetFoot.innerHTML='';
  const owner=isOwner();
  room.weekLabels.forEach((label,i)=>{
    const card=document.createElement('div');
    card.className=`week-card${i===curWeek?' active-card':''}`;
    const header=document.createElement('div');header.className='week-card-header';
    const title=document.createElement('span');title.className='week-card-title';title.textContent=label;
    header.appendChild(title);
    if(owner){
      const acts=document.createElement('div');acts.className='week-card-actions';
      const mk=(txt,fn,color)=>{
        const b=document.createElement('button');b.type='button';b.className='wc-btn';b.textContent=txt;
        if(color)b.style.color=color;
        b.addEventListener('click',fn);return b;
      };
      acts.appendChild(mk('✎',e=>renameWeek(i,e)));
      acts.appendChild(mk('↑',e=>moveWeek(i,-1,e)));
      acts.appendChild(mk('↓',e=>moveWeek(i,1,e)));
      acts.appendChild(mk('✕',e=>deleteWeek(i,e),'var(--danger)'));
      header.appendChild(acts);
    }
    card.appendChild(header);
    card.appendChild(buildMiniGrid(i));
    card.addEventListener('click',()=>{curWeek=i;view='grid';renderViewIcons();closeCellInfo();syncBars();renderBoard();selectTab('main');closeSheet();});
    el.sheetBody.appendChild(card);
  });
  if(owner){
    const add=document.createElement('button');add.type='button';add.className='btn';add.textContent='+ 새 주차 추가';
    add.addEventListener('click',addWeek);el.sheetFoot.appendChild(add);
  }
}
function buildMiniGrid(weekIdx){
  const div=document.createElement('div');div.className='mini-grid';
  const total=Math.max(people.length,1);
  const v=themeVals();
  const cache=people.map(p=>getSlots(p,weekIdx));
  DKEYS.forEach((dk,di)=>{
    const col=document.createElement('div');col.className='mini-col';
    const dl=document.createElement('div');dl.className='mini-day';dl.textContent=DAYS[di];col.appendChild(dl);
    MINI_TIMES.forEach(t=>{
      const key=`${dk}-${t}`;
      const cnt=cache.reduce((s,x)=>s+(x.ok.has(key)?1:0),0);
      const cell=document.createElement('div');cell.className='mini-cell';
      if(cnt>0)cell.style.background=`rgba(${v.heat},${((v.heatMax/total)*cnt).toFixed(2)})`;
      col.appendChild(cell);
    });
    div.appendChild(col);
  });
  return div;
}

/* ---------- 설정 ---------- */
async function changeMyRoomName(){
  const me=getMe();if(!me)return;
  const val=window.prompt('이 방에서 쓸 이름',me.name||'');
  if(val===null)return;
  const name=norm(val,24);if(!name)return;
  try{await updateDoc(doc(db,'rooms',room.id,'members',user.uid),{name,updatedAt:serverTimestamp()});}
  catch(e){window.alert(fmtErr(e));}
}
async function renameRoom(){
  if(!room||!isOwner())return;
  const val=window.prompt('방 이름',room.title||'');
  if(val===null)return;
  const title=norm(val,40);if(!title)return;
  try{
    await updateDoc(doc(db,'rooms',room.id),{title,updatedAt:serverTimestamp()});
    const list=getAdminRooms();
    const hit=list.find(x=>x.roomId===room.id);
    if(hit){hit.title=title;localStorage.setItem(ADMIN_ROOMS_KEY,JSON.stringify(list));}
  }catch(e){window.alert(fmtErr(e));}
}
async function showEntryCode(){
  if(!room||!isOwner())return;
  try{
    if(!cachedEntryCode){
      const snap=await getDoc(doc(db,'roomSecrets',room.id));
      if(!snap.exists())throw new Error('입장 번호 정보를 찾을 수 없어요.');
      cachedEntryCode=snap.data().entryCode;
    }
    window.alert(`입장 번호\n\n${cachedEntryCode}`);
  }catch(e){window.alert(fmtErr(e));}
}
async function clearMine(){
  const me=getMe();if(!me||!room)return;
  const what=view==='grid'?`"${room.weekLabels[curWeek]}"의 시간표`:`${calY}년 ${calM+1}월 달력`;
  if(!window.confirm(`${what} 내 입력을 모두 지울까요?`))return;
  if(view==='grid'){
    me.schedules=me.schedules||{};
    me.schedules[String(curWeek)]={ok:[],no:[]};
  } else {
    const d=getDates(me);
    const keep=k=>{const x=parseKey(k);return !(x.y===calY&&x.m===calM);};
    me.dates={ok:[...d.ok].filter(keep),no:[...d.no].filter(keep)};
  }
  renderBoard();await saveNow();
}
async function clearDecided(){
  if(!room||!isOwner())return;
  const what=view==='grid'?`"${room.weekLabels[curWeek]}"`:`${calM+1}월`;
  if(!window.confirm(`${what} 확정을 모두 지울까요?`))return;
  try{
    if(view==='grid'){
      const dec={...(room.decided||{})};
      delete dec[String(curWeek)];
      await updateDoc(doc(db,'rooms',room.id),{decided:dec,updatedAt:serverTimestamp()});
    } else {
      const keep=(room.decidedDates||[]).filter(k=>{const x=parseKey(k);return !(x.y===calY&&x.m===calM);});
      await updateDoc(doc(db,'rooms',room.id),{decidedDates:keep,updatedAt:serverTimestamp()});
    }
  }catch(e){window.alert(fmtErr(e));}
}
async function removeMember(p){
  if(!room||!isOwner()||p.id===user.uid)return;
  if(!window.confirm(`${p.name} 님을 방에서 내보낼까요?`))return;
  try{
    const batch=writeBatch(db);
    batch.delete(doc(db,'rooms',room.id,'members',p.id));
    await batch.commit();
  }catch(e){window.alert(fmtErr(e));}
}
async function deleteCurrentRoom(){
  if(!requireFB()||!room||!isOwner())return;
  const pw=window.prompt('방을 삭제하려면 관리 비밀번호를 입력하세요.');
  if(!pw)return;
  try{
    const secretSnap=await getDoc(doc(db,'roomSecrets',room.id));
    if(!secretSnap.exists())throw new Error('비밀 정보를 찾을 수 없어요.');
    if(secretSnap.data().passwordHash!==await sha256(pw)){window.alert('비밀번호가 틀렸어요.');return;}
    const membersSnap=await getDocs(collection(db,'rooms',room.id,'members'));
    const batch=writeBatch(db);
    membersSnap.forEach(d=>batch.delete(d.ref));
    batch.delete(doc(db,'roomCodes',secretSnap.data().codeHash));
    batch.delete(doc(db,'roomSecrets',room.id));
    batch.delete(doc(db,'rooms',room.id));
    await batch.commit();
    forgetAdminRoom(room.id);forgetVisited(room.id);leaveRoom(true);
  }catch(e){window.alert(fmtErr(e));}
}

function renderSettings(){
  if(!room)return;
  const me=getMe(),owner=isOwner();
  el.settingsBody.innerHTML='';

  const themeBox=document.createElement('div');themeBox.className='rows';
  const tr=document.createElement('div');tr.className='theme-row';
  [['light','라이트',SUN],['dark','다크',MOON],['auto','시스템',AUTO]].forEach(([key,label,icon])=>{
    const b=document.createElement('button');b.type='button';
    b.className=`theme-opt${themePref===key?' on':''}`;
    b.innerHTML=`${icon}<span>${label}</span>`;
    b.addEventListener('click',()=>setTheme(key));
    tr.appendChild(b);
  });
  themeBox.appendChild(tr);
  el.settingsBody.appendChild(wrapGroup('화면',themeBox));

  el.settingsBody.appendChild(group('내 정보',[
    row({title:'이 방에서 쓸 이름',val:me?me.name:'-',chev:true,onClick:changeMyRoomName}),
    row({title:'지금 화면의 내 입력 지우기',danger:true,onClick:clearMine}),
  ]));

  el.settingsBody.appendChild(group('방',[
    row({title:'방 이름',val:room.title,chev:owner,onClick:owner?renameRoom:null}),
    row({title:'주차 관리',val:`${room.weekLabels.length}개`,chev:true,onClick:openWeekSheet}),
    row({title:'팀원',val:`${people.length}명`,chev:true,onClick:()=>selectTab('people')}),
  ]));

  if(owner){
    el.settingsBody.appendChild(group('관리자',[
      row({title:'입장 번호 보기',chev:true,onClick:showEntryCode}),
      row({title:'지금 화면의 확정 지우기',danger:true,onClick:clearDecided}),
      row({title:'방 삭제',danger:true,onClick:deleteCurrentRoom}),
    ]));
  }

  el.settingsBody.appendChild(group('계정',[
    row({title:'내 ID',meta:user?user.uid:'-'}),
    row({title:'방 나가기',danger:true,onClick:()=>{
      if(window.confirm('이 방에서 나갈까요? 입력한 내용은 남아 있어요.'))leaveRoom(true);
    }}),
  ]));

  const note=document.createElement('div');note.className='notice info';
  note.textContent=owner
    ? '이 기기의 익명 로그인에 방 관리 권한이 묶여 있어요. 브라우저 데이터를 지우거나 기기를 바꾸면 권한을 되찾을 수 없으니 입장 번호를 따로 메모해두세요.'
    : '방 이름 변경, 주차 관리, 확정 시간표, 특별일 표시는 방을 만든 사람만 할 수 있어요.';
  el.settingsBody.appendChild(note);
}
function wrapGroup(label,box){
  const wrap=document.createElement('div');
  const l=document.createElement('div');l.className='sec-label';l.textContent=label;
  wrap.appendChild(l);wrap.appendChild(box);return wrap;
}
function group(label,rowEls){
  const box=document.createElement('div');box.className='rows';
  rowEls.forEach(r=>box.appendChild(r));return wrapGroup(label,box);
}
function row({title,val,meta,chev,danger,onClick}){
  const r=document.createElement(onClick?'button':'div');
  r.className='row';
  if(onClick){r.type='button';r.addEventListener('click',onClick);}
  const main=document.createElement('div');main.className='row-main';
  const t=document.createElement('div');t.className='row-title';t.textContent=title;
  if(danger)t.classList.add('txt-danger');
  main.appendChild(t);
  if(meta){const m=document.createElement('div');m.className='row-meta';m.textContent=meta;main.appendChild(m);}
  r.appendChild(main);
  if(val!==undefined&&val!==null){const vv=document.createElement('div');vv.className='row-val';vv.textContent=val;r.appendChild(vv);}
  if(chev){const c=document.createElement('span');c.className='chev';c.textContent='›';r.appendChild(c);}
  return r;
}

/* ---------- 팀원 ---------- */
function renderPeople(){
  if(!room)return;
  el.peopleCountLabel.textContent=`팀원 ${people.length}명`;
  el.personList.innerHTML='';
  if(!people.length){
    const e=document.createElement('div');e.className='empty';e.textContent='아직 팀원이 없어요.';
    el.personList.appendChild(e);return;
  }
  const owner=isOwner();
  people.forEach(p=>{
    const isMe=p.id===user?.uid;
    const prof=profileCache[p.id]||blankProfile();
    let okCount=0;
    Object.values(p.schedules||{}).forEach(w=>{if(w&&Array.isArray(w.ok))okCount+=w.ok.length;});
    const pending=!hasInput(p);
    const r=document.createElement('div');r.className='row';
    const av=document.createElement('div');av.className='avatar';
    paintAvatar(av,{ci:colorOf(p.id,p.ci),pattern:prof.pattern,initial:(p.name||'?').slice(0,1),size:34});
    const main=document.createElement('div');main.className='row-main';
    const bits=[`가능 시간 ${(okCount/2).toFixed(1)}시간`];
    if(prof.bio)bits.unshift(prof.bio);
    main.innerHTML=`<div class="row-title">${esc(p.name||'이름 없음')}${isMe?' · 나':''}${p.id===room.createdBy?'<span class="owner-tag">방장</span>':''}${pending?'<span class="pend">미입력</span>':''}</div><div class="row-meta">${esc(bits.join(' · '))}</div>`;
    if((prof.tags||[]).length){
      const tg=document.createElement('div');
      tg.style.cssText='display:flex;flex-wrap:wrap;gap:4px;margin-top:5px';
      prof.tags.slice(0,3).forEach(t=>{
        const s=document.createElement('span');
        s.style.cssText='padding:2px 7px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-size:10px;color:var(--text-2)';
        s.textContent=t;tg.appendChild(s);
      });
      main.appendChild(tg);
    }
    r.appendChild(av);r.appendChild(main);
    if(owner&&!isMe){
      const b=document.createElement('button');b.type='button';b.className='row-val txt-danger';b.textContent='내보내기';
      b.addEventListener('click',()=>removeMember(p));
      r.appendChild(b);
    }
    el.personList.appendChild(r);
  });
}

/* ---------- 데이터 ---------- */
function getMe(){return people.find(p=>p.id===user?.uid)||null;}
function getSlots(person,weekIdx){
  const w=person?.schedules?.[String(weekIdx)];
  if(!w||Array.isArray(w))return{ok:new Set(),no:new Set()};
  return{ok:new Set(Array.isArray(w.ok)?w.ok:[]),no:new Set(Array.isArray(w.no)?w.no:[])};
}
function getDates(person){
  const d=person?.dates;
  if(!d||Array.isArray(d))return{ok:new Set(),no:new Set()};
  return{ok:new Set(Array.isArray(d.ok)?d.ok:[]),no:new Set(Array.isArray(d.no)?d.no:[])};
}
function getDecided(weekIdx){
  const s=room?.decided?.[String(weekIdx)];
  return new Set(Array.isArray(s)?s:[]);
}

function applyTool(key){
  const me=getMe();if(!me)return;
  if(view==='grid'){
    const s=getSlots(me,curWeek);
    let ch=false;
    if(tool==='ok'){if(!s.ok.has(key)){s.ok.add(key);ch=true;}if(s.no.delete(key))ch=true;}
    else if(tool==='no'){if(!s.no.has(key)){s.no.add(key);ch=true;}if(s.ok.delete(key))ch=true;}
    else if(tool==='erase'){if(s.ok.delete(key))ch=true;if(s.no.delete(key))ch=true;}
    if(!ch)return;
    me.schedules=me.schedules||{};
    me.schedules[String(curWeek)]={ok:[...s.ok].sort(),no:[...s.no].sort()};
  } else {
    const d=getDates(me);
    let ch=false;
    if(tool==='ok'){if(!d.ok.has(key)){d.ok.add(key);ch=true;}if(d.no.delete(key))ch=true;}
    else if(tool==='no'){if(!d.no.has(key)){d.no.add(key);ch=true;}if(d.ok.delete(key))ch=true;}
    else if(tool==='erase'){if(d.ok.delete(key))ch=true;if(d.no.delete(key))ch=true;}
    if(!ch)return;
    me.dates={ok:[...d.ok].sort(),no:[...d.no].sort()};
  }
  renderBoard();saveSoon();
}
function saveSoon(){clearTimeout(saveTimer);saveTimer=setTimeout(saveNow,SAVE_DELAY);}
async function saveNow(){
  clearTimeout(saveTimer);
  if(!room||!user)return;
  const me=getMe();if(!me)return;
  try{
    await updateDoc(doc(db,'rooms',room.id,'members',user.uid),{
      schedules:me.schedules||{},dates:me.dates||{ok:[],no:[]},updatedAt:serverTimestamp()});
  }catch(e){window.alert(fmtErr(e));}
}

function applyDecided(key){
  if(!room||!isOwner())return;
  if(view==='grid'){
    const s=getDecided(curWeek);
    let ch=false;
    if(tool==='dec'){if(!s.has(key)){s.add(key);ch=true;}}
    else if(tool==='erase'){if(s.delete(key))ch=true;}
    if(!ch)return;
    room.decided={...(room.decided||{}),[String(curWeek)]:[...s].sort()};
  } else {
    const s=new Set(room.decidedDates||[]);
    let ch=false;
    if(tool==='dec'){if(!s.has(key)){s.add(key);ch=true;}}
    else if(tool==='erase'){if(s.delete(key))ch=true;}
    if(!ch)return;
    room.decidedDates=[...s].sort();
  }
  renderBoard();
  clearTimeout(decTimer);decTimer=setTimeout(saveDecidedNow,SAVE_DELAY);
}
async function saveDecidedNow(){
  clearTimeout(decTimer);
  if(!room||!isOwner())return;
  try{
    await updateDoc(doc(db,'rooms',room.id),{
      decided:room.decided||{},decidedDates:room.decidedDates||[],updatedAt:serverTimestamp()});
  }catch(e){window.alert(fmtErr(e));}
}

/* ---------- 로컬 저장 ---------- */
function rememberAdminRoom(r){
  const list=getAdminRooms().filter(x=>x.roomId!==r.roomId);
  list.unshift(r);
  localStorage.setItem(ADMIN_ROOMS_KEY,JSON.stringify(list.slice(0,20)));
}
function forgetAdminRoom(id){
  localStorage.setItem(ADMIN_ROOMS_KEY,JSON.stringify(getAdminRooms().filter(x=>x.roomId!==id)));
}
function getAdminRooms(){try{return JSON.parse(localStorage.getItem(ADMIN_ROOMS_KEY)||'[]');}catch{return[];}}
function rememberVisited(roomId,title){
  const list=getVisited().filter(x=>x.roomId!==roomId);
  list.unshift({roomId,title});
  localStorage.setItem(VISITED_KEY,JSON.stringify(list.slice(0,12)));
}
function forgetVisited(id){
  localStorage.setItem(VISITED_KEY,JSON.stringify(getVisited().filter(x=>x.roomId!==id)));
}
function getVisited(){try{return JSON.parse(localStorage.getItem(VISITED_KEY)||'[]');}catch{return[];}}
function saveSession(id){localStorage.setItem(SESSION_KEY,id);}
function getSavedSession(){return localStorage.getItem(SESSION_KEY);}
function clearSession(){localStorage.removeItem(SESSION_KEY);}

/* ---------- 유틸 ---------- */
function requireFB(){
  if(!HAS_CFG||!db||!user){window.alert('아직 연결 중이에요. 잠시 후 다시 시도해주세요.');return false;}
  return true;
}
function norm(v,max){return String(v||'').trim().replace(/\s+/g,' ').slice(0,max);}
async function sha256(v){
  const b=new TextEncoder().encode(String(v));
  const h=await crypto.subtle.digest('SHA-256',b);
  return[...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('');
}
function ciForUid(uid){return[...uid].reduce((s,c)=>s+c.charCodeAt(0),0)%COLORS.length;}
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmtErr(e){
  if(!e)return'알 수 없는 오류';
  if(e.code==='permission-denied')return'권한이 거부되었어요. 방장만 할 수 있는 작업이거나, Rules의 profiles 규칙을 확인해주세요.';
  if(e.code==='unavailable')return'네트워크 연결을 확인해주세요.';
  return e.message||String(e);
}
