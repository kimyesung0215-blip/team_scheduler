<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff" id="meta-theme">
<title>팀 스케줄러</title>
<style>
/* ===== 테마 변수 ===== */
:root[data-theme="light"]{
  --bg:#eff1f5; --surface:#ffffff; --surface-2:#f4f6fa; --surface-3:#e6e9f0;
  --text:#14171f; --text-2:#6b7280; --text-3:#a5abb6;
  --line:#e8ebf1; --line-2:#f1f3f7;
  --accent:#2f6df6; --accent-soft:#e8efff; --accent-text:#ffffff;
  --danger:#e5484d; --danger-soft:#fdeaea;
  --ok:47,109,246; --no:229,72,77;
  --grid-line:#eef0f5; --grid-hour:#e3e6ed;
  --heat:47,109,246; --heat-max:.68;
  --blocked:#9aa1ad;
  --tl-dawn:#f3f5fa; --tl-day:#fdf9ef; --tl-evening:#f7f1fa; --tl-night:#eceef6;
  --shadow:0 1px 3px rgba(20,23,31,.07);
}
:root[data-theme="dark"]{
  --bg:#0d1017; --surface:#161a23; --surface-2:#1f2430; --surface-3:#2a3040;
  --text:#eef1f6; --text-2:#8f97a6; --text-3:#5e6676;
  --line:#242a36; --line-2:#1c212b;
  --accent:#4d86ff; --accent-soft:#1a2740; --accent-text:#ffffff;
  --danger:#ff6b6b; --danger-soft:#3a1d22;
  --ok:120,160,255; --no:255,107,107;
  --grid-line:#1d222d; --grid-hour:#262c39;
  --heat:120,160,255; --heat-max:.72;
  --blocked:#4a5162;
  --tl-dawn:#131826; --tl-day:#1b1e17; --tl-evening:#1e1826; --tl-night:#10131f;
  --shadow:0 1px 3px rgba(0,0,0,.3);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{color-scheme:light dark}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;min-height:100vh;display:flex;justify-content:center;transition:background .2s,color .2s}
button,input{font:inherit;color:inherit}
button{border:0;cursor:pointer;background:none}
button:disabled{cursor:not-allowed;opacity:.35}

.shell{width:100%;max-width:390px;min-height:100vh;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;position:relative}

/* ===== 공용 ===== */
.card{background:var(--surface);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.sec-label{font-size:11px;font-weight:600;color:var(--text-2);letter-spacing:.03em;margin:0 4px 8px;text-transform:uppercase}
.input{width:100%;background:var(--surface-2);border:1.5px solid transparent;border-radius:12px;padding:12px 13px;font-size:16px;outline:none;transition:all .15s}
.input:focus{border-color:var(--accent);background:var(--surface)}
.input::placeholder{color:var(--text-3)}
.btn{width:100%;background:var(--accent);color:var(--accent-text);border-radius:14px;padding:14px;font-size:15px;font-weight:600;transition:opacity .15s}
.btn:active:not(:disabled){opacity:.72}
.btn-sub{width:100%;background:var(--surface-3);color:var(--text);border-radius:14px;padding:13px;font-size:14px;font-weight:500}
.txt-danger{color:var(--danger)}
.notice{border-radius:12px;padding:12px 13px;font-size:12px;line-height:1.55;white-space:pre-line}
.notice.warn{background:var(--surface);color:var(--danger);box-shadow:var(--shadow)}
.notice.ok{background:var(--accent-soft);color:var(--accent)}
.notice.info{background:var(--surface-2);color:var(--text-2)}
.hidden{display:none!important}

/* ===== 게이트 ===== */
.gate{flex:1;display:flex;flex-direction:column;gap:14px;padding:22px 16px 28px;overflow-y:auto}
.gate-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.gate h1{font-size:27px;font-weight:800;letter-spacing:-.7px;line-height:1.12}
.gate-sub{font-size:12px;color:var(--text-2);margin-top:6px;text-align:left;padding:2px 0}
.gate-sub u{text-decoration-color:var(--text-3);text-underline-offset:2px}
.icon-btn{width:38px;height:38px;border-radius:50%;background:var(--surface);color:var(--text-2);display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:var(--shadow)}
.icon-btn svg{width:19px;height:19px}
.pill{border-radius:999px;background:var(--surface);color:var(--text-2);padding:9px 15px;font-size:12px;font-weight:600;flex-shrink:0;box-shadow:var(--shadow)}
.pill.on{background:var(--accent);color:var(--accent-text)}
.form{display:flex;flex-direction:column;gap:9px}
.code-input{text-align:center;font-size:25px;font-weight:700;letter-spacing:.3em;padding:15px 0;font-variant-numeric:tabular-nums}
.room-card{background:var(--surface-2);border-radius:12px;padding:12px 13px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.room-card-title{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.room-card-meta{font-size:11px;color:var(--text-2);margin-top:3px;font-variant-numeric:tabular-nums}
.room-card-btns{display:flex;gap:6px;flex-shrink:0;align-items:center}
.chip{background:var(--accent);color:var(--accent-text);border-radius:999px;padding:7px 15px;font-size:12px;font-weight:600;flex-shrink:0}
.chip-sub{background:var(--surface-3);color:var(--text-2);border-radius:999px;padding:7px 12px;font-size:12px;font-weight:600;flex-shrink:0}
.stack{display:flex;flex-direction:column;gap:8px}

/* ===== 앱 ===== */
.app{height:100vh;display:flex;flex-direction:column;overflow:hidden}
.topbar{padding:14px 16px 10px;flex-shrink:0}
.topbar-row{display:flex;align-items:center;gap:9px}
.back-btn{width:32px;height:32px;border-radius:50%;background:var(--surface);color:var(--text-2);font-size:17px;line-height:1;flex-shrink:0;box-shadow:var(--shadow)}
.topbar h1{flex:1;min-width:0;font-size:19px;font-weight:800;letter-spacing:-.4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.owner-tag{display:inline-block;background:var(--accent-soft);color:var(--accent);font-size:9px;font-weight:700;padding:3px 7px;border-radius:5px;margin-left:6px;vertical-align:2px}
.week-pick{display:flex;align-items:center;gap:2px;background:var(--surface);border-radius:999px;padding:5px 6px;flex-shrink:0;box-shadow:var(--shadow)}
.week-nav{width:26px;height:26px;border-radius:50%;font-size:15px;color:var(--text-2);line-height:1}
.week-nav:disabled{opacity:.25}
.week-now{font-size:13px;font-weight:700;padding:0 6px;min-width:52px;text-align:center}

.seg{display:flex;background:var(--surface-3);border-radius:11px;padding:3px;margin:10px 16px 0;flex-shrink:0}
.seg-btn{flex:1;padding:8px 0;font-size:13px;font-weight:600;color:var(--text-2);border-radius:9px;transition:all .18s}
.seg-btn.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}

/* 도구 툴바 */
.toolbar{display:flex;gap:6px;margin:8px 16px 0;flex-shrink:0}
.tool{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 6px;border-radius:11px;background:var(--surface);color:var(--text-2);font-size:10px;font-weight:600;border:1.5px solid transparent;box-shadow:var(--shadow);transition:all .15s}
.tool svg{width:17px;height:17px}
.tool.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.tool.on.t-no{border-color:var(--danger);color:var(--danger);background:var(--danger-soft)}

.view{flex:1;overflow-y:auto;min-height:0}
.view-pad{padding:14px 16px 24px;display:flex;flex-direction:column;gap:18px}

/* 그리드 */
.grid-wrap{flex:1;overflow:auto;min-height:0;background:var(--surface);margin:10px 12px 0;border-radius:16px 16px 0 0}
.grid{display:grid;grid-template-columns:2.1rem repeat(7,minmax(1.5rem,1fr))}
.dh{background:var(--surface);position:sticky;top:0;z-index:10;text-align:center;font-size:11px;color:var(--text-2);padding:9px 0 7px;font-weight:600;border-bottom:1px solid var(--line-2)}
.tl{font-size:8.5px;color:var(--text-2);text-align:right;padding-right:4px;line-height:20px;font-variant-numeric:tabular-nums}
.tl.dawn{background:var(--tl-dawn)}
.tl.day{background:var(--tl-day)}
.tl.evening{background:var(--tl-evening)}
.tl.night{background:var(--tl-night)}
.cell{height:20px;position:relative;border-bottom:.5px solid var(--grid-line);border-left:.5px solid var(--grid-line)}
.cell.hourline{border-bottom:.5px solid var(--grid-hour)}
.cell.daypart,.tl.boundary{border-top:1.5px solid var(--grid-hour)}
.grid.drawing .cell{cursor:pointer;touch-action:none}
.badge{position:absolute;bottom:1px;right:2px;font-size:7.5px;font-weight:900;z-index:5;line-height:1;color:var(--text)}

/* 리스트 */
.rows{background:var(--surface);border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:12px;padding:14px;border-bottom:1px solid var(--line-2);width:100%;text-align:left}
.row:last-child{border-bottom:0}
.row-main{flex:1;min-width:0}
.row-title{font-size:15px;font-weight:500}
.row-meta{font-size:11.5px;color:var(--text-2);margin-top:2px;word-break:break-all}
.row-val{font-size:13px;color:var(--text-2);flex-shrink:0;font-variant-numeric:tabular-nums}
.chev{color:var(--text-3);font-size:17px;flex-shrink:0;line-height:1}
.avatar{width:34px;height:34px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#fff}
.empty{text-align:center;padding:48px 20px;color:var(--text-3);font-size:13px;line-height:1.6}

/* 테마 선택 */
.theme-row{display:flex;gap:8px;padding:12px 14px}
.theme-opt{flex:1;border-radius:12px;padding:12px 8px;font-size:12.5px;font-weight:600;background:var(--surface-2);color:var(--text-2);border:1.5px solid transparent;display:flex;flex-direction:column;align-items:center;gap:6px}
.theme-opt.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.theme-opt svg{width:19px;height:19px}

/* 탭바 */
.tabbar{background:var(--surface);border-top:1px solid var(--line);display:flex;padding:6px 8px 8px;flex-shrink:0}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 0;color:var(--text-3);font-size:10px;font-weight:500;transition:color .15s}
.tab.on{color:var(--accent)}
.tab svg{width:22px;height:22px}

/* 팝업 */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:none;align-items:flex-end;justify-content:center}
.overlay.show{display:flex}
.popup{background:var(--bg);border-radius:22px 22px 0 0;width:100%;max-width:390px;max-height:86vh;display:flex;flex-direction:column}
.popup-header{padding:16px 18px 12px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-shrink:0}
.popup-header h2{font-size:18px;font-weight:800;letter-spacing:-.3px}
.popup-close{width:30px;height:30px;border-radius:50%;background:var(--surface-3);color:var(--text-2);font-size:15px;line-height:1}
.popup-body{flex:1;overflow-y:auto;padding:0 16px}
.popup-foot{padding:12px 16px 22px;flex-shrink:0}

.week-card{background:var(--surface);border-radius:14px;margin-bottom:9px;overflow:hidden;cursor:pointer;border:1.5px solid transparent;box-shadow:var(--shadow)}
.week-card.active-card{border-color:var(--accent)}
.week-card-header{display:flex;align-items:center;justify-content:space-between;padding:11px 13px 9px;gap:8px}
.week-card-title{font-size:14px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.week-card-actions{display:flex;gap:2px;flex-shrink:0}
.wc-btn{width:27px;height:27px;border-radius:7px;color:var(--text-2);font-size:12px;background:var(--surface-2)}
.mini-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding:0 12px 12px}
.mini-col{display:flex;flex-direction:column;gap:1px}
.mini-day{font-size:8px;color:var(--text-3);text-align:center;margin-bottom:3px}
.mini-cell{height:3px;border-radius:1px;background:var(--surface-2)}
</style>
</head>
<body>
<div class="shell">

  <!-- ============ 게이트 ============ -->
  <section class="gate" id="gate">
    <div class="gate-top">

        <h1>팀 스케줄러</h1>
        <button class="gate-sub" id="profile-btn" type="button">연결 중...</button>
      </div>
      <button class="icon-btn" id="gate-theme-btn" type="button" aria-label="테마 전환"></button>
    </div>

    <div class="notice warn hidden" id="config-warning"></div>
    <div class="notice hidden" id="status-box"></div>

    <div>
      <div class="sec-label">방 입장</div>
      <div class="card">
        <div class="form">
          <input class="input code-input" id="join-code" inputmode="numeric" maxlength="6" placeholder="000000">

        </div>
      </div>
    </div>

    <div class="hidden" id="recent-section">

    <div class="hidden" id="my-rooms-section">
      <div class="sec-label">내가 만든 방</div>

  <!-- ============ 앱 ============ -->
  <section class="app hidden" id="app">
    <div class="topbar">
      <div class="topbar-row">
        <button class="back-btn" id="back-btn" type="button" aria-label="첫 화면으로">←</button>
        <h1 id="room-title-label">팀 스케줄러</h1>
        <div class="week-pick" id="week-pick">
          <button class="week-nav" id="prev-week" type="button">‹</button>
          <span class="week-now" id="week-label-text">1주차</span>
          <button class="week-nav" id="next-week" type="button">›</button>

      </div>
    </div>

    <div class="seg" id="seg">

      <button class="seg-btn" id="mt-overview" type="button">종합 보기</button>

    <div class="toolbar" id="toolbar">

        이동
      </button>
      <button class="tool" id="tool-ok" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>

      </button>
      <button class="tool t-no" id="tool-no" type="button">

    <div class="grid-wrap" id="view-grid">

    <div class="view hidden" id="view-people">
      <div class="view-pad">

          <div class="sec-label" id="people-count-label">팀원</div>

    <div class="view hidden" id="view-settings">

    <div class="tabbar">

        시간표
      </button>
      <button class="tab" id="bt-people" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="9" cy="8" r="3.4"/><path d="M2.8 20.5v-1.7a4 4 0 0 1 4-4h4.4a4 4 0 0 1 4 4v1.7"/><path d="M16.5 4.9a3.4 3.4 0 0 1 0 6.3"/><path d="M21.2 20.5v-1.7a4 4 0 0 0-3-3.8"/></svg>
        팀원
      </button>
      <button class="tab" id="bt-settings" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3.1"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.84 2.84l-.06-.06a1.7 1.7 0 0 0-2.9 1.22V21a2 2 0 1 1-4 0v-.12a1.7 1.7 0 0 0-2.9-1.16l-.06.06a2 2 0 1 1-2.84-2.84l.06-.06A1.7 1.7 0 0 0 3.1 14H3a2 2 0 1 1 0-4h.12A1.7 1.7 0 0 0 4.28 7.1l-.06-.06a2 2 0 1 1 2.84-2.84l.06.06A1.7 1.7 0 0 0 10 3.1V3a2 2 0 1 1 4 0v.12a1.7 1.7 0 0 0 2.9 1.16l.06-.06a2 2 0 1 1 2.84 2.84l-.06.06A1.7 1.7 0 0 0 20.9 10H21a2 2 0 1 1 0 4h-.12a1.7 1.7 0 0 0-1.48 1z"/></svg>
        설정
      </button>
    </div>
  </section>
</div>

<div class="overlay" id="overlay">
  <div class="popup">
    <div class="popup-header">
      <h2>주차 관리</h2>
      <button class="popup-close" id="popup-close" type="button">✕</button>

    <div class="popup-body" id="popup-body"></div>
    <div class="popup-foot">
      <button class="btn hidden" id="add-week-btn" type="button">+ 새 주차 추가</button>
    </div>
  </div>
</div>

<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js';
import{getAuth,browserLocalPersistence,onAuthStateChanged,setPersistence,signInAnonymously}from'https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js';
import{collection,doc,getDoc,getDocs,getFirestore,onSnapshot,orderBy,query,runTransaction,serverTimestamp,updateDoc,writeBatch}from'https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js';

const CFG = window.SCHEDULER_FIREBASE_CONFIG;
const HAS_CFG = Boolean(CFG?.apiKey && CFG?.projectId && !CFG.apiKey.includes('붙여넣기'));

const DAYS=['월','화','수','목','금','토','일'];
const DKEYS=['MON','TUE','WED','THU','FRI','SAT','SUN'];
const TIMES=Array.from({length:42},(_,i)=>{
  const m=6*60+i*30,h=Math.floor(m/60)%24,min=m%60;
  return`${String(h).padStart(2,'0')}:${min===0?'00':'30'}`;
});
const MINI_TIMES=Array.from({length:24},(_,i)=>{
  const h=9+Math.floor(i/2),m=i%2===0?'00':'30';
  return`${String(h).padStart(2,'0')}:${m}`;
});
function daypartOf(t){
  const h=parseInt(t.slice(0,2),10);
  if(h<9)return'dawn';
  if(h<18)return'day';
  if(h<22)return'evening';

}

/* ---------- 테마 ---------- */
function effectiveTheme(){
  if(themePref==='auto')return mq.matches?'dark':'light';
  return themePref;
}
function applyTheme(){
  const t=effectiveTheme();
  document.documentElement.setAttribute('data-theme',t);
  el.metaTheme.setAttribute('content',t==='dark'?'#0d1017':'#ffffff');
  el.gateThemeBtn.innerHTML=themePref==='auto'?AUTO:(themePref==='dark'?MOON:SUN);
  if(tab==='settings'&&room)renderSettings();
}
function setTheme(pref){
  themePref=pref;
  localStorage.setItem(THEME_KEY,pref);
  applyTheme();
}
/* 게이트 버튼: 라이트 → 다크 → 시스템 순환 */
function cycleTheme(){
  const next=themePref==='light'?'dark':(themePref==='dark'?'auto':'light');
  setTheme(next);
}

function bindEvents(){
  el.gateThemeBtn.addEventListener('click',cycleTheme);
  el.profileBtn.addEventListener('click',()=>{if(authReady)editMyName();});
  el.adminToggle.addEventListener('click',()=>setCreateUI(!createOpen));
  el.joinBtn.addEventListener('click',joinRoom);
  el.createRoomBtn.addEventListener('click',createRoom);
  el.backBtn.addEventListener('click',()=>leaveRoom(false));
  el.prevWeek.addEventListener('click',()=>gotoWeek(curWeek-1));
  el.nextWeek.addEventListener('click',()=>gotoWeek(curWeek+1));
  el.mtEdit.addEventListener('click',()=>setMode('edit'));
  el.mtOverview.addEventListener('click',()=>setMode('overview'));
  el.toolMove.addEventListener('click',()=>setTool('move'));
  el.toolOk.addEventListener('click',()=>setTool('ok'));
  el.toolNo.addEventListener('click',()=>setTool('no'));
  el.toolErase.addEventListener('click',()=>setTool('erase'));
  el.btGrid.addEventListener('click',()=>selectTab('grid'));
  el.btPeople.addEventListener('click',()=>selectTab('people'));
  el.btSettings.addEventListener('click',()=>selectTab('settings'));
  el.popupClose.addEventListener('click',closePopup);
  el.overlay.addEventListener('click',e=>{if(e.target===el.overlay)closePopup();});
  el.addWeekBtn.addEventListener('click',addWeek);
  el.joinCode.addEventListener('input',()=>{
    el.joinCode.value=el.joinCode.value.replace(/\D/g,'').slice(0,6);
  });
  el.joinCode.addEventListener('keydown',e=>{if(e.key==='Enter')joinRoom();});
  el.joinName.addEventListener('keydown',e=>{if(e.key==='Enter')joinRoom();});

  el.grid.addEventListener('pointerdown',e=>{
    if(tool==='move'||mode!=='edit')return;
    const cell=e.target.closest?.('.cell');
    if(!cell||!cell.dataset.key)return;
    const me=getMe();if(!me)return;
    e.preventDefault();
    drag=true;
    applyTool(cell.dataset.key);
  });
  document.addEventListener('pointermove',e=>{
    if(!drag)return;
    e.preventDefault();
    const t=document.elementFromPoint(e.clientX,e.clientY);
    const cell=t&&t.closest?t.closest('.cell'):null;
    if(cell&&cell.dataset.key)applyTool(cell.dataset.key);
  },{passive:false});
  document.addEventListener('pointerup',()=>{if(drag)saveNow();drag=false;});
  document.addEventListener('pointercancel',()=>{if(drag)saveNow();drag=false;});
}

/* ---------- 게이트 ---------- */
function setCreateUI(on){
  createOpen=on;
  localStorage.setItem(CREATE_KEY,on?'1':'0');
  el.adminToggle.className=`pill${on?' on':''}`;
  el.adminToggle.textContent=on?'닫기':'방 만들기';
  el.adminPanel.classList.toggle('hidden',!on);
}

function setControlsEnabled(on){
  [el.joinBtn,el.createRoomBtn].forEach(b=>b.disabled=!on);
}

async function createRoom(){
  if(!requireFB())return;
  const title=norm(el.roomTitle.value,40)||'새 방';
  const ownerName=norm(el.ownerName.value,24)||myName||'방장';
  const pw=el.roomPassword.value.trim();
  if(pw.length<4){setStatus('비밀번호는 4자 이상이어야 해요.',true);return;}
  try{
    el.createRoomBtn.disabled=true;
    const roomRef=doc(collection(db,'rooms'));
    const code=await makeCode();
    const codeHash=await sha256(code);
    const pwHash=await sha256(pw);
    const batch=writeBatch(db);
    batch.set(roomRef,{title,createdBy:user.uid,createdAt:serverTimestamp(),updatedAt:serverTimestamp(),weekLabels:DEFAULT_WEEKS});
    batch.set(doc(db,'roomCodes',codeHash),{roomId:roomRef.id,createdBy:user.uid,createdAt:serverTimestamp()});
    batch.set(doc(db,'roomSecrets',roomRef.id),{roomId:roomRef.id,entryCode:code,codeHash,passwordHash:pwHash,createdBy:user.uid,createdAt:serverTimestamp()});
    batch.set(doc(db,'rooms',roomRef.id,'members',user.uid),{uid:user.uid,name:ownerName,ci:ciForUid(user.uid),schedules:{},joinedAt:serverTimestamp(),updatedAt:serverTimestamp()});
    await batch.commit();
    setMyName(ownerName);
    rememberAdminRoom({roomId:roomRef.id,title,entryCode:code});
    el.roomPassword.value='';
    setStatus('');
    window.alert(`방을 만들었어요\n\n입장 번호: ${code}\n\n이 번호를 팀원에게 알려주세요.\n(설정 탭에서 다시 볼 수 있어요)`);
    saveSession(roomRef.id);
    enterRoom(roomRef.id);
  }catch(e){setStatus(fmtErr(e),true);}
  finally{el.createRoomBtn.disabled=false;}
}

async function makeCode(){
  for(let i=0;i<12;i++){
    const c=String(Math.floor(100000+Math.random()*900000));
    const snap=await getDoc(doc(db,'roomCodes',await sha256(c)));
    if(!snap.exists())return c;
  }
  throw new Error('고유 코드 생성에 실패했어요.');
}

async function joinRoom(){
  if(!requireFB())return;
  const code=el.joinCode.value.trim();
  const name=norm(el.joinName.value,24);
  if(!/^\d{6}$/.test(code)){setStatus('6자리 숫자를 입력해주세요.',true);return;}
  if(!name){setStatus('이름을 입력해주세요.',true);return;}
  try{
    el.joinBtn.disabled=true;
    const codeSnap=await getDoc(doc(db,'roomCodes',await sha256(code)));
    if(!codeSnap.exists()){setStatus('입장 번호가 맞지 않아요.',true);return;}
    const roomId=codeSnap.data().roomId;
    await runTransaction(db,async tx=>{
      const roomRef=doc(db,'rooms',roomId);
      const memberRef=doc(db,'rooms',roomId,'members',user.uid);
      const rSnap=await tx.get(roomRef);
      if(!rSnap.exists())throw new Error('방이 존재하지 않아요.');
      const mSnap=await tx.get(memberRef);
      if(mSnap.exists()){tx.update(memberRef,{name,updatedAt:serverTimestamp()});return;}
      tx.set(memberRef,{uid:user.uid,name,ci:ciForUid(user.uid),schedules:{},joinedAt:serverTimestamp(),updatedAt:serverTimestamp()});
    });
    setMyName(name);
    saveSession(roomId);
    enterRoom(roomId);
    setStatus('');
  }catch(e){setStatus(fmtErr(e),true);}
  finally{el.joinBtn.disabled=false;}
}

async function resumeLastRoom(){
  if(!requireFB()||!user)return;
  const roomId=getSavedSession();
  if(!roomId)return;
  try{
    const snap=await getDoc(doc(db,'rooms',roomId,'members',user.uid));
    if(!snap.exists()){clearSession();return;}
    enterRoom(roomId);
  }catch(e){setStatus(fmtErr(e),true);}
}

async function openFromList(roomId){
  if(!requireFB())return;
  try{
    const snap=await getDoc(doc(db,'rooms',roomId));
    if(!snap.exists()){
      forgetAdminRoom(roomId);
      forgetVisited(roomId);
      renderGateLists();
      window.alert('삭제된 방이에요. 목록에서 지웠어요.');
      return;
    }
    saveSession(roomId);
    enterRoom(roomId);
  }catch(e){window.alert(fmtErr(e));}
}

/* ---------- 방 ---------- */
function enterRoom(roomId){
  closeWatchers();
  room={id:roomId,title:'',weekLabels:DEFAULT_WEEKS,createdBy:null};
  people=[];curWeek=0;firstScroll=false;cachedEntryCode=null;
  setTool('move');
  selectTab('grid');
  el.gate.classList.add('hidden');
  el.app.classList.remove('hidden');

  roomUnsub=onSnapshot(doc(db,'rooms',roomId),snap=>{
    if(!snap.exists()){
      forgetAdminRoom(roomId);forgetVisited(roomId);
      leaveRoom(true);window.alert('방이 삭제되었어요.');return;
    }
    const d=snap.data();
    room={id:snap.id,title:d.title||'팀 스케줄러',createdBy:d.createdBy,
      weekLabels:Array.isArray(d.weekLabels)&&d.weekLabels.length?d.weekLabels:DEFAULT_WEEKS};
    if(curWeek>=room.weekLabels.length)curWeek=room.weekLabels.length-1;
    rememberVisited(room.id,room.title);
    render();
    if(tab==='settings')renderSettings();
    if(el.overlay.classList.contains('show'))renderPopup();
  },e=>window.alert(fmtErr(e)));

  membersUnsub=onSnapshot(
    query(collection(db,'rooms',roomId,'members'),orderBy('joinedAt','asc')),
    snap=>{
      people=snap.docs.map(d=>({id:d.id,...d.data(),schedules:d.data().schedules||{}}));
      render();
      if(tab==='people')renderPeople();
      if(tab==='settings')renderSettings();
    },e=>window.alert(fmtErr(e))
  );
}

function leaveRoom(clear=true){
  closeWatchers();
  room=null;people=[];drag=false;cachedEntryCode=null;
  if(clear)clearSession();
  closePopup();
  el.app.classList.add('hidden');
  el.gate.classList.remove('hidden');
  applyMyName();
  renderGateLists();
}

function closeWatchers(){
  if(roomUnsub)roomUnsub();
  if(membersUnsub)membersUnsub();
  roomUnsub=membersUnsub=null;
}

function isOwner(){return Boolean(room&&user&&room.createdBy===user.uid);}

/* ---------- 탭/모드/도구 ---------- */
function selectTab(t){
  tab=t;
  el.btGrid.className=`tab${t==='grid'?' on':''}`;
  el.btPeople.className=`tab${t==='people'?' on':''}`;
  el.btSettings.className=`tab${t==='settings'?' on':''}`;
  el.viewGrid.classList.toggle('hidden',t!=='grid');
  el.viewPeople.classList.toggle('hidden',t!=='people');

  el.seg.classList.toggle('hidden',t!=='grid');
  el.weekPick.classList.toggle('hidden',t!=='grid');
  el.toolbar.classList.toggle('hidden',t!=='grid'||mode!=='edit');
  if(t==='people')renderPeople();
  if(t==='settings')renderSettings();
}

function setMode(m){
  mode=m;
  el.mtEdit.className=`seg-btn${m==='edit'?' on':''}`;
  el.mtOverview.className=`seg-btn${m==='overview'?' on':''}`;
  el.toolbar.classList.toggle('hidden',m!=='edit');
  if(m!=='edit')setTool('move');
  render();

function setTool(t){
  tool=t;
  el.toolMove.className=`tool${t==='move'?' on':''}`;
  el.toolOk.className=`tool${t==='ok'?' on':''}`;
  el.toolNo.className=`tool t-no${t==='no'?' on':''}`;
  el.toolErase.className=`tool${t==='erase'?' on':''}`;

}

function gotoWeek(i){
  if(!room||i<0||i>=room.weekLabels.length)return;
  curWeek=i;render();
}

/* ---------- 주차 (소유자) ---------- */
async function addWeek(){
  if(!room||!isOwner())return;
  const labels=[...room.weekLabels,`${room.weekLabels.length+1}주차`];
  try{
    await updateDoc(doc(db,'rooms',room.id),{weekLabels:labels,updatedAt:serverTimestamp()});
    curWeek=labels.length-1;
  }catch(e){window.alert(fmtErr(e));}
}

async function deleteWeek(i,e){
  e.stopPropagation();
  if(!room||!isOwner()||room.weekLabels.length<=1)return;
  if(!window.confirm(`"${room.weekLabels[i]}"를 삭제할까요?`))return;
  const labels=room.weekLabels.filter((_,j)=>j!==i);
  try{
    await updateDoc(doc(db,'rooms',room.id),{weekLabels:labels,updatedAt:serverTimestamp()});
    if(curWeek>=labels.length)curWeek=labels.length-1;
  }catch(err){window.alert(fmtErr(err));}
}

async function moveWeek(i,dir,e){
  e.stopPropagation();
  if(!room||!isOwner())return;
  const j=i+dir;
  if(j<0||j>=room.weekLabels.length)return;
  const labels=[...room.weekLabels];
  [labels[i],labels[j]]=[labels[j],labels[i]];
  try{
    await updateDoc(doc(db,'rooms',room.id),{weekLabels:labels,updatedAt:serverTimestamp()});
    if(curWeek===i)curWeek=j;else if(curWeek===j)curWeek=i;
  }catch(err){window.alert(fmtErr(err));}
}

async function renameWeek(i,e){
  e.stopPropagation();
  if(!room||!isOwner())return;
  const v=window.prompt('주차 이름',room.weekLabels[i]);
  if(v===null)return;
  const name=norm(v,20);
  if(!name)return;
  const labels=[...room.weekLabels];labels[i]=name;
  try{
    await updateDoc(doc(db,'rooms',room.id),{weekLabels:labels,updatedAt:serverTimestamp()});
  }catch(err){window.alert(fmtErr(err));}
}

async function changeMyName(){
  const me=getMe();if(!me)return;
  const v=window.prompt('내 이름',me.name||'');
  if(v===null)return;
  const name=norm(v,24);
  if(!name)return;

    await updateDoc(doc(db,'rooms',room.id,'members',user.uid),{name,updatedAt:serverTimestamp()});
    setMyName(name);
  }catch(e){window.alert(fmtErr(e));}
}

async function renameRoom(){
  if(!room||!isOwner())return;
  const v=window.prompt('방 이름',room.title||'');
  if(v===null)return;
  const title=norm(v,40);
  if(!title)return;
  try{
    await updateDoc(doc(db,'rooms',room.id),{title,updatedAt:serverTimestamp()});
    const list=getAdminRooms();
    const hit=list.find(x=>x.roomId===room.id);
    if(hit){hit.title=title;localStorage.setItem(ADMIN_ROOMS_KEY,JSON.stringify(list));}
  }catch(e){window.alert(fmtErr(e));}
}

async function showEntryCode(){
  if(!room||!isOwner())return;
  try{
    if(!cachedEntryCode){
      const snap=await getDoc(doc(db,'roomSecrets',room.id));
      if(!snap.exists())throw new Error('입장 번호 정보를 찾을 수 없어요.');
      cachedEntryCode=snap.data().entryCode;
    }
    window.alert(`입장 번호\n\n${cachedEntryCode}`);
  }catch(e){window.alert(fmtErr(e));}
}

async function clearMyWeek(){
  const me=getMe();if(!me||!room)return;
  if(!window.confirm(`"${room.weekLabels[curWeek]}"의 내 입력을 모두 지울까요?`))return;
  me.schedules=me.schedules||{};
  me.schedules[String(curWeek)]={ok:[],no:[]};
  render();
  await saveNow();
}

async function removeMember(p){
  if(!room||!isOwner()||p.id===user.uid)return;
  if(!window.confirm(`${p.name} 님을 방에서 내보낼까요?`))return;
  try{
    const batch=writeBatch(db);
    batch.delete(doc(db,'rooms',room.id,'members',p.id));
    await batch.commit();
  }catch(e){window.alert(fmtErr(e));}
}

async function deleteCurrentRoom(){
  if(!requireFB()||!room||!isOwner())return;
  const pw=window.prompt('방을 삭제하려면 관리 비밀번호를 입력하세요.');
  if(!pw)return;
  try{
    const secretSnap=await getDoc(doc(db,'roomSecrets',room.id));
    if(!secretSnap.exists())throw new Error('비밀 정보를 찾을 수 없어요.');
    if(secretSnap.data().passwordHash!==await sha256(pw)){window.alert('비밀번호가 틀렸어요.');return;}
    const membersSnap=await getDocs(collection(db,'rooms',room.id,'members'));
    const batch=writeBatch(db);
    membersSnap.forEach(d=>batch.delete(d.ref));
    batch.delete(doc(db,'roomCodes',secretSnap.data().codeHash));
    batch.delete(doc(db,'roomSecrets',room.id));
    batch.delete(doc(db,'rooms',room.id));
    await batch.commit();
    forgetAdminRoom(room.id);
    forgetVisited(room.id);
    leaveRoom(true);
  }catch(e){window.alert(fmtErr(e));}
}

/* ---------- 설정 화면 ---------- */
function renderSettings(){
  if(!room)return;
  const me=getMe();
  const owner=isOwner();
  el.settingsBody.innerHTML='';

  const themeBox=document.createElement('div');themeBox.className='rows';
  const tr=document.createElement('div');tr.className='theme-row';
  [['light','라이트',SUN],['dark','다크',MOON],['auto','시스템',AUTO]].forEach(([key,label,icon])=>{
    const b=document.createElement('button');b.type='button';
    b.className=`theme-opt${themePref===key?' on':''}`;
    b.innerHTML=`${icon}<span>${label}</span>`;
    b.addEventListener('click',()=>setTheme(key));
    tr.appendChild(b);
  });
  themeBox.appendChild(tr);
  el.settingsBody.appendChild(wrapGroup('화면',themeBox));

  el.settingsBody.appendChild(group('내 정보',[
    row({title:'이름',val:me?me.name:'-',chev:true,onClick:changeMyName}),
    row({title:'이번 주차 입력 지우기',danger:true,onClick:clearMyWeek}),
  ]));

  el.settingsBody.appendChild(group('방',[
    row({title:'방 이름',val:room.title,chev:owner,onClick:owner?renameRoom:null}),
    row({title:'주차 관리',val:`${room.weekLabels.length}개`,chev:true,onClick:openPopup}),
    row({title:'팀원',val:`${people.length}명`,chev:true,onClick:()=>selectTab('people')}),
  ]));

  if(owner){
    el.settingsBody.appendChild(group('관리자',[
      row({title:'입장 번호 보기',chev:true,onClick:showEntryCode}),
      row({title:'방 삭제',danger:true,onClick:deleteCurrentRoom}),
    ]));
  }

  el.settingsBody.appendChild(group('계정',[
    row({title:'내 ID',meta:user?user.uid:'-'}),
    row({title:'방 나가기',danger:true,onClick:()=>{
      if(window.confirm('이 방에서 나갈까요? 입력한 시간표는 남아 있어요.'))leaveRoom(true);
    }}),
  ]));

  const note=document.createElement('div');
  note.className='notice info';
  note.textContent=owner
    ? '이 기기의 익명 로그인에 방 관리 권한이 묶여 있어요. 브라우저 데이터를 지우거나 기기를 바꾸면 권한을 되찾을 수 없으니 입장 번호를 따로 메모해두세요.'
    : '방 이름 변경, 주차 추가·삭제, 방 삭제는 방을 만든 사람만 할 수 있어요.';
  el.settingsBody.appendChild(note);
}

function wrapGroup(label,box){
  const wrap=document.createElement('div');
  const l=document.createElement('div');l.className='sec-label';l.textContent=label;
  wrap.appendChild(l);wrap.appendChild(box);
  return wrap;
}
function group(label,rowEls){
  const box=document.createElement('div');box.className='rows';
  rowEls.forEach(r=>box.appendChild(r));
  return wrapGroup(label,box);
}
function row({title,val,meta,chev,danger,onClick}){
  const r=document.createElement(onClick?'button':'div');
  r.className='row';
  if(onClick){r.type='button';r.addEventListener('click',onClick);}
  const main=document.createElement('div');main.className='row-main';
  const t=document.createElement('div');t.className='row-title';
  t.textContent=title;
  if(danger)t.classList.add('txt-danger');
  main.appendChild(t);
  if(meta){const m=document.createElement('div');m.className='row-meta';m.textContent=meta;main.appendChild(m);}
  r.appendChild(main);
  if(val!==undefined&&val!==null){const v=document.createElement('div');v.className='row-val';v.textContent=val;r.appendChild(v);}
  if(chev){const c=document.createElement('span');c.className='chev';c.textContent='›';r.appendChild(c);}
  return r;
}

/* ---------- 팀원 ---------- */
function renderPeople(){
  if(!room)return;
  el.peopleCountLabel.textContent=`팀원 ${people.length}명`;
  el.personList.innerHTML='';
  if(!people.length){
    const e=document.createElement('div');e.className='empty';e.textContent='아직 팀원이 없어요.';
    el.personList.appendChild(e);return;
  }
  const owner=isOwner();
  people.forEach(p=>{
    const isMe=p.id===user?.uid;
    const c=COLORS[(p.ci||0)%COLORS.length];
    let okCount=0;
    Object.values(p.schedules||{}).forEach(w=>{
      if(w&&Array.isArray(w.ok))okCount+=w.ok.length;
    });
    const r=document.createElement('div');r.className='row';
    const av=document.createElement('div');av.className='avatar';
    av.style.background=c.solid;av.textContent=(p.name||'?').slice(0,1);
    const main=document.createElement('div');main.className='row-main';
    main.innerHTML=`<div class="row-title">${esc(p.name||'이름 없음')}${isMe?' · 나':''}${p.id===room.createdBy?'<span class="owner-tag">관리자</span>':''}</div><div class="row-meta">가능 시간 ${(okCount/2).toFixed(1)}시간</div>`;
    r.appendChild(av);r.appendChild(main);
    if(owner&&!isMe){
      const b=document.createElement('button');b.type='button';b.className='row-val txt-danger';b.textContent='내보내기';
      b.addEventListener('click',()=>removeMember(p));
      r.appendChild(b);
    }
    el.personList.appendChild(r);
  });
}

/* ---------- 그리드 ---------- */
function render(){
  if(!room)return;
  const me=getMe();
  const total=Math.max(people.length,1);
  const css=getComputedStyle(document.documentElement);
  const heat=css.getPropertyValue('--heat').trim();
  const heatMax=parseFloat(css.getPropertyValue('--heat-max'))||.7;
  const okRGB=css.getPropertyValue('--ok').trim();
  const noRGB=css.getPropertyValue('--no').trim();
  const blocked=css.getPropertyValue('--blocked').trim();

  el.roomTitleLabel.textContent=room.title;
  el.weekLabelText.textContent=room.weekLabels[curWeek]||'1주차';
  el.prevWeek.disabled=curWeek<=0;
  el.nextWeek.disabled=curWeek>=room.weekLabels.length-1;
  el.grid.innerHTML='';

  const corner=document.createElement('div');corner.className='dh';el.grid.appendChild(corner);
  DAYS.forEach(d=>{const h=document.createElement('div');h.className='dh';h.textContent=d;el.grid.appendChild(h);});

  const mine=me?getSlots(me,curWeek):{ok:new Set(),no:new Set()};
  const editable=mode==='edit'&&Boolean(me);
  const slotsCache=people.map(p=>({p,s:getSlots(p,curWeek)}));

  let prevPart=null;
  TIMES.forEach((t,ti)=>{
    const part=daypartOf(t);
    const isBoundary=prevPart!==null&&part!==prevPart;
    prevPart=part;

    const tl=document.createElement('div');
    tl.className=`tl ${part}${isBoundary?' boundary':''}`;
    tl.textContent=ti%2===0?t:'';
    el.grid.appendChild(tl);

    DKEYS.forEach(dk=>{
      const key=`${dk}-${t}`;
      const cell=document.createElement('div');
      cell.className=`cell${ti%2?' hourline':''}${isBoundary?' daypart':''}`;
      if(editable)cell.dataset.key=key;

      if(mode==='edit'){
        slotsCache.forEach(({p,s})=>{
          if(p.id===user?.uid)return;
          if(s.ok.has(key)){
            const c=COLORS[(p.ci||0)%COLORS.length];
            const l=document.createElement('div');
            l.style.cssText=`position:absolute;inset:0;background:${c.solid};opacity:.1`;
            cell.appendChild(l);
          }
        });
        if(mine.ok.has(key)){
          const l=document.createElement('div');
          l.style.cssText=`position:absolute;inset:0;background:rgba(${okRGB},.42)`;
          cell.appendChild(l);
        } else if(mine.no.has(key)){
          const l=document.createElement('div');
          l.style.cssText=`position:absolute;inset:0;background:rgba(${noRGB},.4)`;
          cell.appendChild(l);
        }
      } else {
        let okCnt=0,noCnt=0;
        slotsCache.forEach(({s})=>{
          if(s.ok.has(key))okCnt++;
          if(s.no.has(key))noCnt++;
        });
        if(noCnt>0){
          const l=document.createElement('div');
          l.style.cssText=`position:absolute;inset:0;background:repeating-linear-gradient(45deg,${blocked} 0 2px,transparent 2px 5px);opacity:.5`;
          cell.appendChild(l);
        } else if(okCnt>0){
          const a=((heatMax/total)*okCnt).toFixed(2);
          const l=document.createElement('div');
          l.style.cssText=`position:absolute;inset:0;background:rgba(${heat},${a})`;
          cell.appendChild(l);
          if(okCnt>=2){
            const b=document.createElement('span');b.className='badge';
            b.textContent=okCnt;
            if(okCnt/total>0.6)b.style.color='#fff';
            cell.appendChild(b);
          }
        }
      }
      el.grid.appendChild(cell);
    });
  });

  if(!firstScroll){firstScroll=true;setTimeout(()=>{el.viewGrid.scrollTop=20*6;},60);}
}

/* ---------- 주차 팝업 ---------- */
function openPopup(){renderPopup();el.overlay.classList.add('show');}
function closePopup(){el.overlay.classList.remove('show');}

function renderPopup(){
  el.popupBody.innerHTML='';
  if(!room)return;
  const owner=isOwner();
  el.addWeekBtn.classList.toggle('hidden',!owner);
  room.weekLabels.forEach((label,i)=>{
    const card=document.createElement('div');
    card.className=`week-card${i===curWeek?' active-card':''}`;
    const header=document.createElement('div');header.className='week-card-header';
    const title=document.createElement('span');title.className='week-card-title';
    title.textContent=label;
    header.appendChild(title);
    if(owner){
      const acts=document.createElement('div');acts.className='week-card-actions';
      const mk=(txt,fn,color)=>{
        const b=document.createElement('button');b.type='button';b.className='wc-btn';b.textContent=txt;
        if(color)b.style.color=color;
        b.addEventListener('click',fn);return b;
      };
      acts.appendChild(mk('✎',e=>renameWeek(i,e)));
      acts.appendChild(mk('↑',e=>moveWeek(i,-1,e)));
      acts.appendChild(mk('↓',e=>moveWeek(i,1,e)));
      acts.appendChild(mk('✕',e=>deleteWeek(i,e),'var(--danger)'));
      header.appendChild(acts);
    }
    card.appendChild(header);
    card.appendChild(buildMiniGrid(i));
    card.addEventListener('click',()=>{curWeek=i;render();selectTab('grid');closePopup();});
    el.popupBody.appendChild(card);
  });
}

function buildMiniGrid(weekIdx){
  const div=document.createElement('div');div.className='mini-grid';
  const total=Math.max(people.length,1);
  const css=getComputedStyle(document.documentElement);
  const heat=css.getPropertyValue('--heat').trim();
  const heatMax=parseFloat(css.getPropertyValue('--heat-max'))||.7;
  const slotsCache=people.map(p=>getSlots(p,weekIdx));
  DKEYS.forEach((dk,di)=>{
    const col=document.createElement('div');col.className='mini-col';
    const dl=document.createElement('div');dl.className='mini-day';dl.textContent=DAYS[di];col.appendChild(dl);
    MINI_TIMES.forEach(t=>{
      const key=`${dk}-${t}`;
      const cnt=slotsCache.reduce((s,x)=>s+(x.ok.has(key)?1:0),0);
      const cell=document.createElement('div');cell.className='mini-cell';
      if(cnt>0)cell.style.background=`rgba(${heat},${((heatMax/total)*cnt).toFixed(2)})`;
      col.appendChild(cell);
    });
    div.appendChild(col);
  });
  return div;
}

/* ---------- 데이터 ---------- */
function getMe(){return people.find(p=>p.id===user?.uid)||null;}

function getSlots(person,weekIdx){
  const w=person?.schedules?.[String(weekIdx)];
  if(!w||Array.isArray(w))return{ok:new Set(),no:new Set()};
  return{
    ok:new Set(Array.isArray(w.ok)?w.ok:[]),
    no:new Set(Array.isArray(w.no)?w.no:[]),
  };
}

function applyTool(key){
  const me=getMe();if(!me)return;
  const s=getSlots(me,curWeek);
  let changed=false;
  if(tool==='ok'){
    if(!s.ok.has(key)){s.ok.add(key);changed=true;}
    if(s.no.delete(key))changed=true;
  } else if(tool==='no'){
    if(!s.no.has(key)){s.no.add(key);changed=true;}
    if(s.ok.delete(key))changed=true;
  } else if(tool==='erase'){
    if(s.ok.delete(key))changed=true;
    if(s.no.delete(key))changed=true;
  }
  if(!changed)return;
  me.schedules=me.schedules||{};
  me.schedules[String(curWeek)]={ok:[...s.ok].sort(),no:[...s.no].sort()};
  render();
  saveSoon();
}

function saveSoon(){clearTimeout(saveTimer);saveTimer=setTimeout(saveNow,SAVE_DELAY);}

async function saveNow(){
  clearTimeout(saveTimer);
  if(!room||!user)return;
  const me=getMe();if(!me)return;
  try{
    await updateDoc(doc(db,'rooms',room.id,'members',user.uid),{schedules:me.schedules||{},updatedAt:serverTimestamp()});
  }catch(e){window.alert(fmtErr(e));}
}

/* ---------- 로컬 저장 ---------- */
function rememberAdminRoom(r){
  const list=getAdminRooms().filter(x=>x.roomId!==r.roomId);
  list.unshift(r);
  localStorage.setItem(ADMIN_ROOMS_KEY,JSON.stringify(list.slice(0,20)));
}
function forgetAdminRoom(id){
  localStorage.setItem(ADMIN_ROOMS_KEY,JSON.stringify(getAdminRooms().filter(x=>x.roomId!==id)));
}
function getAdminRooms(){try{return JSON.parse(localStorage.getItem(ADMIN_ROOMS_KEY)||'[]');}catch{return[];}}

function rememberVisited(roomId,title){
  const list=getVisited().filter(x=>x.roomId!==roomId);
  list.unshift({roomId,title});
  localStorage.setItem(VISITED_KEY,JSON.stringify(list.slice(0,10)));
}
function forgetVisited(id){
  localStorage.setItem(VISITED_KEY,JSON.stringify(getVisited().filter(x=>x.roomId!==id)));
}
function getVisited(){try{return JSON.parse(localStorage.getItem(VISITED_KEY)||'[]');}catch{return[];}}

async function copyCode(code,btn){
  try{
    await navigator.clipboard.writeText(code);
    const old=btn.textContent;
    btn.textContent='복사됨';
    setTimeout(()=>{btn.textContent=old;},1200);
  }catch{
    window.alert(`입장 번호: ${code}`);
  }
}

function renderGateLists(){
  const visited=getVisited();
  const mine=getAdminRooms();
  const mineIds=new Set(mine.map(x=>x.roomId));

  el.recentList.innerHTML='';
  const recentOnly=visited.filter(x=>!mineIds.has(x.roomId));
  el.recentSection.classList.toggle('hidden',!recentOnly.length);
  recentOnly.forEach(r=>{
    const card=document.createElement('div');card.className='card';card.style.padding='0';
    const inner=document.createElement('div');inner.className='room-card';
    inner.innerHTML=`<div><div class="room-card-title">${esc(r.title||'방')}</div></div>`;
    const btn=document.createElement('button');btn.type='button';btn.className='chip';btn.textContent='입장';
    btn.addEventListener('click',()=>openFromList(r.roomId));
    inner.appendChild(btn);
    card.appendChild(inner);
    el.recentList.appendChild(card);
  });

  el.adminRoomList.innerHTML='';
  el.myRoomsSection.classList.toggle('hidden',!mine.length);
  mine.forEach(r=>{
    const card=document.createElement('div');card.className='card';card.style.padding='0';
    const inner=document.createElement('div');inner.className='room-card';
    inner.innerHTML=`<div style="min-width:0"><div class="room-card-title">${esc(r.title||'방')}</div><div class="room-card-meta">입장 번호 ${esc(r.entryCode)}</div></div>`;
    const btns=document.createElement('div');btns.className='room-card-btns';
    const copyBtn=document.createElement('button');copyBtn.type='button';copyBtn.className='chip-sub';copyBtn.textContent='복사';
    copyBtn.addEventListener('click',()=>copyCode(r.entryCode,copyBtn));
    const openBtn=document.createElement('button');openBtn.type='button';openBtn.className='chip';openBtn.textContent='열기';
    openBtn.addEventListener('click',()=>openFromList(r.roomId));
    btns.appendChild(copyBtn);btns.appendChild(openBtn);
    inner.appendChild(btns);
    card.appendChild(inner);
    el.adminRoomList.appendChild(card);
  });
}

function saveSession(id){localStorage.setItem(SESSION_KEY,id);}
function getSavedSession(){return localStorage.getItem(SESSION_KEY);}
function clearSession(){localStorage.removeItem(SESSION_KEY);}

/* ---------- 유틸 ---------- */
function setStatus(msg,isError=false){
  if(!msg){el.statusBox.classList.add('hidden');return;}
  el.statusBox.classList.remove('hidden','warn','ok','info');
  el.statusBox.classList.add(isError?'warn':'ok');
  el.statusBox.textContent=msg;
}

function requireFB(){
  if(!HAS_CFG||!db||!user){setStatus('아직 연결 중이에요. 잠시 후 다시 시도해주세요.',true);return false;}
  return true;
}
function norm(v,max){return String(v||'').trim().replace(/\s+/g,' ').slice(0,max);}
async function sha256(v){
  const b=new TextEncoder().encode(String(v));
  const h=await crypto.subtle.digest('SHA-256',b);
  return[...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('');
}
function shortId(v){return`${v.slice(0,4)}…${v.slice(-4)}`;}
function ciForUid(uid){return[...uid].reduce((s,c)=>s+c.charCodeAt(0),0)%COLORS.length;}
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmtErr(e){
  if(!e)return'알 수 없는 오류';
  if(e.code==='permission-denied')return'권한이 거부되었어요. 방 관리자만 할 수 있는 작업일 수 있어요.';
  if(e.code==='unavailable')return'네트워크 연결을 확인해주세요.';
  return e.message||String(e);
}
